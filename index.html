*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{font-size:13px;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:inherit;border:none;outline:none;background:none;}
input,select,textarea{font-family:inherit;font-size:13px;outline:none;border:none;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bdk);border-radius:3px;}
.topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;position:relative;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.tb-left{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.tb-center{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tb-icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txm);font-size:16px;transition:all .15s;background:transparent;border:none;}
.tb-icon-btn:hover{background:var(--bg);color:var(--tx);}
.tb-icon-btn.active{background:var(--slt);color:var(--sf);}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:9px;padding:6px 12px;min-width:220px;cursor:text;transition:border .15s;}
.tb-search:focus-within{border-color:var(--sf);background:#fff;}
.tb-search input{background:transparent;font-size:12.5px;color:var(--tx);width:100%;border:none;outline:none;}
.tb-search input::placeholder{color:var(--txl);}
.tb-search .tb-si{color:var(--txl);font-size:14px;flex-shrink:0;}
.tb-notif{position:relative;}
.tb-notif-dot{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--rd);border-radius:50%;border:2px solid #fff;font-size:8px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;}
.tb-profile{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:10px;cursor:pointer;transition:all .15s;border:1.5px solid transparent;}
.tb-profile:hover{background:var(--bg);border-color:var(--bd);}
.tb-ava{width:32px;height:32px;border-radius:50%;background:var(--sf);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-pname{font-size:12.5px;font-weight:700;color:var(--tx);}
.tb-prole{font-size:10px;color:var(--txl);}
.tb-settings-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txm);font-size:17px;transition:all .15s;}
.tb-settings-btn:hover{background:var(--bg);color:var(--sf);transform:rotate(30deg);}
.bc-home{color:var(--sf);cursor:pointer;font-weight:600;}
.bc-home:hover{text-decoration:underline;}
.bc-sep{color:var(--bdk);}
.bc-cur{color:var(--txm);font-weight:600;}
.page-wrap{flex:1;overflow-y:auto;padding:16px 20px;display:flex;gap:16px;}
.page-main{flex:1;min-width:0;}
.page-aside{width:280px;flex-shrink:0;}
.shd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.stl{font-size:22px;font-weight:800;color:var(--tx);line-height:1.2;}
.sst{font-size:12px;color:var(--txl);margin-top:3px;}
.sac{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--bd);box-shadow:var(--shadow);}
.chd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);}
.cht{font-weight:700;font-size:13px;color:var(--tx);}
.cbd{padding:14px 16px;}
.stats{display:grid;gap:12px;margin-bottom:16px;}
.s4{grid-template-columns:repeat(5,1fr);}
.stat{background:var(--card);border-radius:var(--radius);border:1px solid var(--bd);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat.hi{border-color:#fecdb0;background:linear-gradient(135deg,#fff4ee,#fff);}
.stat-ico{position:absolute;right:14px;top:14px;font-size:28px;opacity:.15;}
.sl-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txl);margin-bottom:6px;}
.sv{font-size:24px;font-weight:900;color:var(--tx);font-family:'JetBrains Mono',monospace;line-height:1;}
.ss{font-size:11px;color:var(--txl);margin-top:5px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid transparent;white-space:nowrap;line-height:1;}
.btn-p{background:var(--sf);color:#fff;border-color:var(--sf);}
.btn-p:hover{background:var(--sfh);box-shadow:0 2px 8px rgba(232,93,4,.3);}
.btn-g{background:#fff;color:var(--txm);border-color:var(--bd);}
.btn-g:hover{background:var(--bg);border-color:var(--bdk);}
.btn-n{background:var(--nv);color:#fff;}
.btn-n:hover{background:var(--nv2);}
.btn-d{background:var(--rlt);color:var(--rd);border-color:#fca5a5;}
.btn-d:hover{background:#fee2e2;}
.btn-t{background:var(--tlt);color:var(--tl);border-color:#99f6e4;}
.btn-s{background:var(--gn);color:#fff;border-color:var(--gn);}
.btn-s:hover{background:#15803d;}
.btn-am{background:var(--am);color:#fff;border-color:var(--am);}
.btn-am:hover{background:#b45309;}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none;box-shadow:none!important;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}

.nv{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.68);cursor:pointer;transition:all .15s;border-radius:9px;text-align:left;position:relative;white-space:nowrap;margin-bottom:2px;border-left:none;}

.sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
.sb-foot{flex-shrink:0;border-top:1px solid rgba(255,255,255,.08);padding:12px;position:relative;z-index:1;}

.sb-collapse-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;color:rgba(255,255,255,.65);font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:all .15s;}
.sb-collapse-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.sb-collapse-btn span{display:inline-block;transition:transform .22s;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txl);padding:0 2px 8px;flex-shrink:0;}
.page{flex:1;overflow-y:auto;padding:16px 20px;background:transparent;}
.hero-card{position:relative;overflow:hidden;border-radius:16px;padding:22px 24px;background:var(--grad-hero);color:#fff;box-shadow:var(--shadow-float);display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:150px;}
.hero-card::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 45%),
             radial-gradient(circle at 15% 90%,rgba(219,39,119,.35),transparent 50%);}
.hero-ico{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;z-index:1;}
.hero-title{font-size:19px;font-weight:800;position:relative;z-index:1;}
.hero-sub{font-size:12px;color:rgba(255,255,255,.8);position:relative;z-index:1;max-width:230px;}
.hero-btn{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:10px 18px;background:#fff;color:#4338ca;font-weight:800;font-size:13px;border-radius:9px;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.hero-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.22);}
.kpi-row{display:grid;grid-template-columns:1.35fr repeat(5,1fr);gap:var(--gap);margin-bottom:var(--gap);align-items:stretch;}
.kpi{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-width:0;}

.kpi-val{font-size:20px;font-weight:900;color:var(--tx);font-family:'JetBrains Mono',monospace;line-height:1.1;}
.kpi-trend{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
.kpi-trend.up{color:var(--gn);}
.kpi-trend.down{color:var(--rd);}
.kpi-trend.flat{color:var(--txl);}
.kpi-spark{margin-top:2px;height:26px;}
.sec-wrap{border-radius:14px;padding:14px;margin-bottom:var(--gap);}
.sec-blue{background:var(--sec-blue);}
.sec-indigo{background:var(--sec-indigo);}
.sec-mint{background:var(--sec-mint);}
.sec-cyan{background:var(--sec-cyan);}
.sec-lav{background:var(--sec-lav);}
.sec-sky{background:var(--sec-sky);}
.dash-row3{display:grid;grid-template-columns:minmax(0,2.75fr) minmax(210px,0.95fr) minmax(175px,0.72fr);gap:var(--gap);align-items:start;margin-bottom:var(--gap);}
.dash-row2{display:grid;grid-template-columns:minmax(0,2.75fr) minmax(210px,0.95fr) minmax(175px,0.72fr);gap:var(--gap);align-items:start;margin-bottom:var(--gap);}
.dash-row-wide{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,0.92fr);gap:var(--gap);align-items:start;margin-bottom:var(--gap);}

.delivery-badge{cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}

.status-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:12px;}

.task-item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--bd);}

.task-t{font-size:12px;font-weight:700;color:var(--tx);}
.task-s{font-size:11px;color:var(--txl);margin-top:1px;}
.task-time{font-size:10px;color:var(--txl);white-space:nowrap;flex-shrink:0;}
.foot-stats{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap);background:var(--sec-sky);border-radius:14px;padding:14px;}
.fstat{display:flex;align-items:center;gap:10px;min-width:0;}
.fstat-ico{width:34px;height:34px;border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:var(--shadow);}
.fstat-l{font-size:9.5px;font-weight:700;color:var(--txl);text-transform:uppercase;letter-spacing:.4px;}

@media (max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr);}
.dash-row3,.dash-row2,.dash-row-wide{grid-template-columns:1fr;}

.foot-stats{grid-template-columns:repeat(3,1fr);}}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 14px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;transition:all .18s;text-align:center;}

<script id="mdm-beta-baseline-init">
/*
 * MDM ERP — BETA CLEAN DATA BASELINE
 *
 * One-time migration:
 *   KEEP  -> School Master List / master configuration
 *   RESET -> every invoice transaction, invoice history/register, sync state,
 *            delivery/share state, generated-PDF references, caches and
 *            test invoice numbering state.
 *
 * This runs only once, then the BETA data becomes the canonical real-data
 * baseline and is never automatically wiped again.

(function(){
  const BETA_RESET_KEY="mdm_erp_beta_clean_baseline_v1";

  // IMPORTANT: only explicit transactional keys belong here.
  // Master-list/configuration keys are intentionally excluded.
  const RESET_KEYS=[
    // Canonical application state keys used by the project's A/V42 data layer.
    "iv","dp","rv","ib","iu","al",
    // Transactional aliases/caches.
    "invoiceData",
    "invoiceHistory",
    "invoiceRegister",
    "invoiceLog",
    "savedInvoices",
    "generatedInvoices",
    "invoiceRecords",
    "invoiceStore",
    "invoiceSync",
    "syncQueue",
    "offlineQueue",
    "deliveryState",
    "shareState",
    "batchShareState",
    "invoicePdfCache",
    "pdfCache",
    "preparedPdfCache",
    "invoiceNumberState",
    "invoiceCounter",
    "invoiceSequence",
    "usedInvoiceNumbers",
    "invoiceAudit",
    "invoiceAuditLog"
  ];

  // Common project-prefixed variants are also reset, but ONLY when their
  // names clearly identify invoice/sync/share transactional state.
  const RESET_PATTERNS=[
    /^(?:mdm|mse)[_-]?(?:invoice|invoices|invoicehistory|invoiceregister|invoicelog|invoice_store)/i,
    /^(?:mdm|mse)[_-]?(?:sync|offline)[_-]?(?:queue|state)/i,
    /^(?:mdm|mse)[_-]?(?:delivery|share|batchshare)[_-]?(?:state|queue)?/i,
    /^(?:mdm|mse)[_-]?(?:invoice|pdf)[_-]?(?:cache|references?)/i,
    /^(?:mdm|mse)[_-]?(?:invoice|used)[_-]?(?:numbers?|counter|sequence)/i,
    /^(?:mdm|mse)[_-]?(?:invoice)[_-]?(?:audit|log)/i

    if(localStorage.getItem(BETA_RESET_KEY)) return;

    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k) keys.push(k);
    }
    keys.forEach(k=>{ if(shouldReset(k)) localStorage.removeItem(k); });

    // Clear session-only transactional state.
    const sessionKeys=[];
    for(let i=0;i<sessionStorage.length;i++){
      const k=sessionStorage.key(i);
      if(k && shouldReset(k)) sessionStorage.removeItem(k);
    }

    // Do NOT delete the application's IndexedDB wholesale. If the project
    // later exposes an explicit transactional object store, it can be migrated
    // safely by its own schema. Guessing an IndexedDB database name/store here
    // could destroy the School Master List.
    localStorage.setItem(BETA_RESET_KEY,"1");
  }catch(e){
    console.error("BETA clean data baseline initialization failed:",e);
    // Do not set the completion flag after a failure.
  }
})();
</script>

function fyMonthOrder(month,year){

function axCDoc(c,sch,form,invNo){
  // Combined Annexure C — A/B remain distinct sections.
  // Default rendering target is A4 portrait, isolated from the locked Main Invoice.
  // Pagination is data-aware and future-proof: each section can continue without
  // flattening A+B, while the final page alone receives Combined Total + signature.
  c=c||{}; form=form||{}; sch=sch||{};
  const f=A.firm||{}, S=A.sett||ST0;
  const rowsA=Array.isArray(c.annexA)?c.annexA:[], rowsB=Array.isArray(c.annexB)?c.annexB:[];
  const mapRows=(src)=>src.map((item,i)=>({
    sr:i+1,name:item?.name??"",hsn:S.hsnVisible?(item?.hsn??""):"",unit:item?.unit??"",
    qty:item?.qty??"",rate:item?.rate??"",gross:item?.gross??item?.amount??0
  }));
  const a=mapRows(rowsA), b=mapRows(rowsB);
  const subtotal=arr=>arr.reduce((s,r)=>s+Number(r.gross||0),0);
  const totalNet=Number.isFinite(Number(c?.mTot?.net))?Number(c.mTot.net):subtotal(a)+subtotal(b);
  const cfg=getAnnexurePrintConfig();
  const dims=PAGE_SIZES_MM[cfg.pageSize]||PAGE_SIZES_MM.A4;
  const sheetW=cfg.orientation==='landscape'?dims[1]:dims[0];
  const sheetH=cfg.orientation==='landscape'?dims[0]:dims[1];
  const printableW=sheetW-14, printableH=sheetH-15;
  const baseW=196;
  const widthRatio=Math.max(.72,Math.min(1.75,printableW/baseW));
  const capacityBase=27;
  const capacity=Math.max(8,Math.floor(capacityBase*widthRatio));

  // Keep the approved A4 portrait appearance exactly as the baseline. In wider
  // future modes, the same structure gets more horizontal room rather than a
  // different design. The +5 row allowance is a target, not a blind guarantee.
  const maxName=Math.max(0,...a.concat(b).map(r=>String(r.name||"").length));
  const longNamePenalty=maxName>34?2:maxName>26?1:0;
  const effectiveCapacity=Math.max(8,capacity-longNamePenalty);
  const chunk=(arr,n)=>{const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out;};
  // Page packing rule: when both sections are within the single-page target,
  // keep A and B together (e.g. 24 + 24 remains one page). Once a section
  // exceeds the target, continue that section first; the next section starts
  // after the continuation so A/B identity is never lost.
  const pages=[];
  if(a.length<=effectiveCapacity && b.length<=effectiveCapacity){
    pages.push({parts:[{section:'A',rows:a,index:0,total:1},{section:'B',rows:b,index:0,total:1}]});
  }else{
    const chunksA=chunk(a,effectiveCapacity), chunksB=chunk(b,effectiveCapacity);
    let ai=0, bi=0;
    while(ai<chunksA.length){
      const parts=[{section:'A',rows:chunksA[ai],index:ai,total:chunksA.length}];
      ai++;
      if(ai===chunksA.length && bi<chunksB.length){
        parts.push({section:'B',rows:chunksB[bi],index:bi,total:chunksB.length});
        bi++;
      }
      pages.push({parts});
    }
    while(bi<chunksB.length){
      pages.push({parts:[{section:'B',rows:chunksB[bi],index:bi,total:chunksB.length}]});
      bi++;
    }
  }
  const renderedPages=[];
  pages.forEach((page,pi)=>{
    const isLast=pi===pages.length-1;
    let html=`<div class="axc-page" style="max-width:${Math.min(100,printableW)}mm">${pageHead()}`;
    page.parts.forEach(pg=>{
      const sec=pg.section==='A'?'Section A - Class 1 to 5':'Section B - Class 6 to 8';
      const cls=pg.section==='A'?'axc-a':'axc-b';
      html+=sectionHTML(sec,pg.rows,cls,pg.index>0);
      if(pg.index===pg.total-1){
        html+=`<div class="axc-grand-total" style="grid-template-columns:1fr 18%;background:#E3F0D6;border-top:1px solid #8AA56B;border-bottom:1px solid #8AA56B"><span>Sub-Total ${ec(sec.replace(/^Section\s+/,''))}</span><strong>${subtotal(pg.section==='A'?a:b).toFixed(2)}</strong></div>`;
      }
    });
    if(isLast){
      html+=`<div class="axc-grand-total"><span>COMBINED TOTAL</span><strong>${totalNet.toFixed(2)}</strong></div><div class="axc-foot"><div>${nw(totalNet)}</div><div class="axc-sign"><div class="axc-sign-line"></div>Authorised Signatory - ${ec(f.name||'')}</div></div>`;
    }
    html+='</div>'; renderedPages.push(html);
  });
  if(!renderedPages.length){
    renderedPages.push(`<div class="axc-page" style="max-width:${Math.min(100,printableW)}mm">${pageHead()}<div class="axc-section-title">No annexure items</div><div class="axc-grand-total"><span>COMBINED TOTAL</span><strong>${totalNet.toFixed(2)}</strong></div><div class="axc-foot"><div>${nw(totalNet)}</div><div class="axc-sign"><div class="axc-sign-line"></div>Authorised Signatory - ${ec(f.name||'')}</div></div></div>`);
  }
  return `<div class="ax axc-doc" style="max-width:${Math.min(100,printableW)}mm">${renderedPages.join('')}</div>`;
}

// ═══ DASHBOARD ═══
function sparkSvg(values, color, w, h){
  w=w||96; h=h||26;
  if(!values || values.length===0) return "";
  const max=Math.max(...values,0.0001), min=Math.min(...values,0);
  const range=(max-min)||1;
  const stepX = values.length>1? w/(values.length-1) : 0;
  const pts = values.map((v,i)=>{
    const x=i*stepX;
    const y=h-2-((v-min)/range)*(h-4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const lastPt=pts.split(" ").pop().split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="2.5" fill="${color}"/>
  </svg>`;
}
function deliveryState(inv){
  const d=inv&&inv.delivery||{};
  return {status:d.status||inv.deliveryStatus||"NOT_SENT",method:d.method||inv.deliveryMethod||"",at:d.at||inv.deliveryAt||null};
}
function deliveryBadge(inv){
  const d=deliveryState(inv);
  const sent=d.status==="SENT";
  const label=sent?"Sent":"Not Sent";
  const cls=sent?"bg":"br";
  const title=sent?(d.method?`Sent via ${d.method}${d.at?" · "+new Date(d.at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):""}`:"Sent") : "Click to mark manually as sent";
  return `<span class="bdg ${cls} delivery-badge" title="${ec(title)}" onclick="event.stopPropagation();markDeliverySent('${inv.id}')">${sent?"✓":"•"} ${label}</span>`;
}
function markDeliverySent(id,method="Manual"){
  const inv=A.invoices.find(i=>i.id===id);
  if(!inv)return;
  const d=deliveryState(inv);
  if(d.status==="SENT"){toast(`Already marked Sent${d.method?" via "+d.method:""}`,"info");return;}
  if(!confirm(`Mark ${inv.invNo} as Sent?\n\nThis records that the invoice was manually dispatched.`))return;
  const at=new Date().toISOString();
  inv.delivery={status:"SENT",method,at};
  inv.deliveryStatus="SENT";inv.deliveryMethod=method;inv.deliveryAt=at;
  sv("iv",A.invoices);
  auditLog("UPDATE","invoice",id,`Delivery marked Sent (${method}): ${inv.invNo}`,null);
  toast(`${inv.invNo} marked as Sent`,"ok");
  gP("dashboard");
}

function niManualInput(el){
  NI.manualNum=(el.value||"").replace(/\D/g,"");
  if(el.value!==NI.manualNum) el.value=NI.manualNum;
  const es=niEffectiveSeries(), n=parseInt(NI.manualNum,10);
  const status=document.querySelector(".ni-manual-status");
  if(status){
    if(Number.isFinite(n)&&n>0){
      const exists=invNoFYUsedCounter(es,n);
      status.className="ni-manual-status "+(exists?"err":"ok");
      status.innerHTML=exists?"&#10005; Invoice number already used in this Financial Year":"&#10003; Available in "+ec(es.fy);
    }else{
      status.className="ni-manual-status";
      status.textContent="";
    }
  }
}
function niFilterSchoolPicker(q){
  const menu=document.querySelector(".ni-school-picker-menu"); if(!menu)return;
  const needle=String(q||"").trim().toLowerCase();
  menu.querySelectorAll(".ni-school-picker-group").forEach(group=>{
    const cat=(group.querySelector(".ni-school-picker-cat")?.textContent||"").toLowerCase();
    let visible=0;
    group.querySelectorAll(".ni-school-picker-option").forEach(btn=>{
      const match=!needle || cat.includes(needle) || (btn.textContent||"").toLowerCase().includes(needle);
      btn.style.display=match?"":"none";
      if(match)visible++;
    });
    group.style.display=visible?"":"none";
  });
  const empty=menu.querySelector(".ni-school-picker-empty");
  if(empty){
    const any=[...menu.querySelectorAll(".ni-school-picker-option")].some(b=>b.style.display!=="none");
    empty.style.display=any?"none":"";
  }
}
function niSchoolSearchInput(el){
  NI.schoolSearch=el.value||"";
  niFilterSchoolPicker(NI.schoolSearch);
}
function closeSchoolPickerOutside(target){
  if(!NI.schoolOpen)return;

async function printMasterInvoiceFile(file,title,onDone){
  // v4.39 — CANONICAL PDF -> NATIVE PRINT SHEET BRIDGE
  // The exact already-generated Master PDF remains the only source. We do NOT
  // rebuild the invoice as HTML, SVG, canvas, PNG or any other representation.
  if(!file||file.type!=="application/pdf")throw new Error("Canonical Master PDF is unavailable");
  const url=URL.createObjectURL(file);
  let cleaned=false;
  const cleanup=()=>{
    if(cleaned)return;
    cleaned=true;
    if(onDone)onDone();
    // Keep the blob alive for Android's native print activity / PDF viewer.
    setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},180000);
  };

  // Android browsers do not expose the PDF viewer's internal "Save as PDF"
  // controls to page JavaScript. The reliable route is to load the SAME PDF
  // into an isolated print iframe and invoke the browser's native print
  // pipeline on that PDF document. If the browser refuses to print a PDF
  // plugin/iframe, we fall back to opening the exact same PDF (never HTML).
  try{
    const frame=document.createElement("iframe");
    frame.setAttribute("data-master-pdf-print","1");
    frame.setAttribute("title","Locked Master Invoice Print Preview");
    frame.style.cssText="position:fixed;left:-10000px;top:0;width:100%;height:100%;border:0;visibility:hidden;opacity:0;pointer-events:none;";
    frame.src=url;
    document.body.appendChild(frame);

    let finished=false;
    const fallback=()=>{
      if(finished)return;
      finished=true;
      try{frame.remove();}catch(e){}
      const w=window.open(url,"_blank");
      if(!w){
        const a=document.createElement("a");
        a.href=url;a.target="_blank";a.rel="noopener";a.download=file.name;
        document.body.appendChild(a);a.click();a.remove();
      }
      toast("PDF opened — use Print / Save as PDF from the PDF viewer","ok");
      cleanup();
    };

    const invokeNativePrint=()=>{
      if(finished)return;
      try{
        const fw=frame.contentWindow;
        if(!fw||typeof fw.print!=="function")throw new Error("PDF print bridge unavailable");
        // Give the embedded PDF viewer a moment to attach its document before
        // invoking print. This preserves the exact PDF as the print source.
        setTimeout(()=>{
          try{
            fw.focus();
            fw.print();
            // Do not immediately remove the frame: Android's print activity is
            // external and may still be reading the PDF stream.
            setTimeout(()=>{
              if(!finished){
                finished=true;
                try{frame.remove();}catch(e){}
                toast("Print preview opened — choose Save as PDF to save the locked invoice","ok");
                cleanup();
              }
            },2500);
          }catch(e){ fallback(); }
        },700);
      }catch(e){ fallback(); }
    };

    frame.addEventListener("load",invokeNativePrint,{once:true});
    // Some Android PDF viewers do not fire iframe load reliably.
    setTimeout(()=>{if(!finished)invokeNativePrint();},1800);
    // Hard fallback if the native print bridge is ignored.
    setTimeout(()=>{if(!finished)fallback();},6500);
  }catch(e){
    try{
      const w=window.open(url,"_blank");
      if(!w)throw e;
      toast("PDF opened — use Print / Save as PDF from the PDF viewer","ok");
      cleanup();
    }catch(_){
      try{URL.revokeObjectURL(url);}catch(e2){}
      throw e;
    }
  }
}

// v4.12 — REAL DOM-PORTAL INVOICE ACTION MENU
// Do not re-render Invoice History when the three-dot button is tapped.
// Re-rendering caused the mobile page to visibly jump and, on some WebViews,
// the newly-created button lost the original click/focus event. The menu is
// now created once in <body>, positioned against the tapped button, and kept
// completely outside the invoice grid/card overflow hierarchy.
let HIST_MENU_EL=null;
let HIST_MENU_BTN=null;

function positionHistActionMenu(){
  const menu=HIST_MENU_EL, btn=HIST_MENU_BTN;
  if(!menu||!btn||!document.body.contains(menu)||!document.body.contains(btn))return;
  menu.style.position='fixed';
  menu.style.left='0px';
  menu.style.top='0px';
  menu.style.right='auto';
  menu.style.maxWidth=Math.min(240,window.innerWidth-20)+'px';
  const r=btn.getBoundingClientRect();
  const mr=menu.getBoundingClientRect();
  const gap=6;
  let left=r.right-mr.width;
  left=Math.max(10,Math.min(left,window.innerWidth-mr.width-10));
  let top=r.bottom+gap;
  if(top+mr.height>window.innerHeight-10) top=Math.max(10,r.top-mr.height-gap);
  menu.style.left=Math.round(left)+'px';
  menu.style.top=Math.round(top)+'px';
}

function closeHistMenu(){
  if(HIST_MENU_EL){HIST_MENU_EL.remove();HIST_MENU_EL=null;}
  if(HIST_MENU_BTN){HIST_MENU_BTN.setAttribute('aria-expanded','false');}
  HIST_MENU_BTN=null;
  HS.mId=null;
}

function toggleMobileHistoryInfo(id,btn){
  const key=String(id);
  const nodes=document.querySelectorAll(".hist-mobile-extra[data-mobile-info-id]");
  let extra=null;
  for(const n of nodes){if(n.getAttribute("data-mobile-info-id")===key){extra=n;break;}}
  if(!extra)return;
  const open=!extra.hasAttribute("hidden");
  if(open)extra.setAttribute("hidden","");
  else extra.removeAttribute("hidden");
  if(btn)btn.setAttribute("aria-expanded",String(!open));
}

function histMenuAction(action, encodedId){
  const id=decodeURIComponent(String(encodedId||''));
  closeHistMenu();
  if(!id)return;
  if(action==='view'){opIM(id);return;}
  if(action==='pdf'){hsPDF(id);return;}
  if(action==='share'){shrInv(id);return;}
  if(action==='revisions'){HS.rId=id;HS.page=1;gP('history');return;}
  if(action==='audit'){AUD_ID=id;gP('audit');return;}
  if(action==='cancel'){canInv(id);return;}
  if(action==='undo'){openInvoiceUndo(id);return;}
}

function toggleHistMenu(id, btn){
  if(!btn)return;
  if(HIST_MENU_EL && HS.mId===id){closeHistMenu();return;}
  closeHistMenu();
  HS.mId=id;
  HIST_MENU_BTN=btn;
  btn.setAttribute('aria-expanded','true');

  const inv=A.invoices.find(i=>i.id===id);
  if(!inv){closeHistMenu();return;}
  const encodedInvId=encodeURIComponent(String(id));
  const menu=document.createElement('div');
  menu.className='hist-action-menu';
  menu.setAttribute('role','menu');
  menu.setAttribute('aria-label','Invoice actions');
  menu.dataset.invoiceId=id;
  menu.innerHTML=`
    <button type="button" class="hist-action-menu-item" role="menuitem" data-action="view">View</button>
    <button type="button" class="hist-action-menu-item" role="menuitem" data-action="pdf">PDF</button>
    <button type="button" class="hist-action-menu-item" role="menuitem" data-action="share">Share</button>
    <button type="button" class="hist-action-menu-item" role="menuitem" data-action="revisions">Revisions</button>

    ${isInvoiceUndoAuthorized(inv)&&invoiceUndoAllowed(inv).ok?`<div class="hist-action-menu-sep"></div><button type="button" class="hist-action-menu-item undo-action" role="menuitem" data-action="undo">&#8630; Undo Generation</button>`:''}
    ${inv.status!=="cancelled"&&inv.status!=="released"?`<button type="button" class="hist-action-menu-item danger" role="menuitem" data-action="cancel">Cancel</button>`:''}
  `;
  document.body.appendChild(menu);
  menu.addEventListener('click',function(e){
    const item=e.target.closest('.hist-action-menu-item');
    if(!item)return;
    e.preventDefault();e.stopPropagation();

  HIST_MENU_EL=menu;

function refreshHistorySearchResults(){

  if(!root)return;
  // Build the updated History markup off-DOM, then replace only the result
  // and statistics regions. The search input itself is never recreated, so
  // Android/Chrome keeps the native keyboard, focus and cursor stable.
  const html=pgHist();
  const tpl=document.createElement("template");
  tpl.innerHTML=html;
  const nextStats=tpl.content.querySelector("#hist-search-stats");
  const nextResults=tpl.content.querySelector("#hist-search-results");
  const nextCount=tpl.content.querySelector("#hist-filter-result-count");
  const nextExportCount=tpl.content.querySelector("#hist-export-count");
  const curStats=document.getElementById("hist-search-stats");
  const curResults=document.getElementById("hist-search-results");
  const curCount=document.getElementById("hist-filter-result-count");
  const curExportCount=document.getElementById("hist-export-count");
  if(curStats&&nextStats)curStats.innerHTML=nextStats.innerHTML;
  if(curResults&&nextResults)curResults.innerHTML=nextResults.innerHTML;
  if(curCount&&nextCount)curCount.textContent=nextCount.textContent;
  if(curExportCount&&nextExportCount)curExportCount.textContent=nextExportCount.textContent;
  // Keep the native input untouched; only its value/state is already current.
}

const INV_UNDO_REASONS=["Wrong Billing Month Selected","Wrong Invoice Number Selected","Duplicate / Accidental Invoice Generated","Incorrect Invoice Details Before Finalization"];
function invoiceUndoAllowed(inv){
  if(!inv)return {ok:false,msg:"Invoice not found"};
  if(inv.status!=="active")return {ok:false,msg:"Only an active invoice can be undone"};
  const active=Array.isArray(A.invoices)?A.invoices.filter(i=>i.status==="active"&&i.savedAt):[];
  const latest=active.reduce((best,i)=>!best||new Date(i.savedAt)>new Date(best.savedAt)?i:best,null);
  if(latest&&latest.id!==inv.id)return {ok:false,msg:"Only the latest generated invoice can be undone"};
  if(inv.revisedAt||inv.revisions?.length)return {ok:false,msg:"This invoice has revisions and can no longer be undone"};
  if((inv.printCount||0)>0||inv.lastPrintedAt)return {ok:false,msg:"This invoice has already been printed"};
  if(inv.payment||inv.paymentId||inv.receiptId||inv.creditNoteId||inv.debitNoteId||inv.eInvoiceId||inv.ewayBillNo||inv.submittedAt||inv.settledAt||inv.paidAt)return {ok:false,msg:"This invoice has a protected accounting/statutory dependency"};
  if(["synced","syncing","uploading","processing"].includes(inv.syncStatus))return {ok:false,msg:"This invoice has already entered the sync process"};
  const shared=Array.isArray(inv.shareHistory)&&inv.shareHistory.length || inv.deliveryAt || inv.delivery?.at;
  if(shared)return {ok:false,msg:"This invoice has already been shared"};
  return {ok:true};
}

function confirmInvoiceUndo(id){
  const inv=A.invoices.find(i=>i.id===id);
  if(!inv){document.getElementById("inv-undo-dlg")?.remove();toast("Invoice not found","err");return;}
  if(!isInvoiceUndoAuthorized(inv)){toast("Undo is available to the invoice creator or Administrator","err");return;}

  if(reason==="Other Reason"&&!comment){toast("Please enter a custom reason","err");return;}
  const at=new Date().toISOString();

  const archive={id:uid(),invoiceId:inv.id,invoiceNo:inv.invNo,archivedAt:at,archivedBy:A.currentUser?.name||"Administrator",archivedByUserId:A.currentUser?.id||"",reason,comment,originalCreatedAt:inv.savedAt||"",invoice:snapshot};

  sv("iu",archives);

  sv("rv",(A.rv||[]).filter(x=>x!==id));
  if(A.flashId===id)A.flashId=null;
  const usedCounter=invoiceCounterAnySeries(inv.invNo,A.series);
  const previousSeries=inv.undoMeta?.seriesStateBefore;
  const previousCounter=Number(inv.undoMeta?.seriesCounterBefore);
  let restoredSeries=false;
  if(previousSeries&&typeof previousSeries==="object"&&A.series.counter===usedCounter){
    A.series={...A.series,...JSON.parse(JSON.stringify(previousSeries))};
    sv("sr",A.series);
    restoredSeries=true;
  }else if(usedCounter!==null&&Number.isFinite(previousCounter)&&A.series.counter===usedCounter&&previousCounter<=usedCounter){
    A.series.counter=previousCounter;
    sv("sr",A.series);
    restoredSeries=true;
  }

  gP("history");
}

let BI={show:false,raw:BULK_SCHOOL_SAMPLE,result:null};
function biOpen(){BI.show=true;BI.result=null;gP("schools");}
function biClose(){BI.show=false;gP("schools");}
function biAddrParts(addr){
  // "Block-Chiraiya, East Champaran[-845435]" → block:"Chiraiya", district:"East Champaran"
  // Address string itself is stored verbatim (rule: preserve address formatting).
  const m=addr.match(/^Block[-\s]+([^,]+),\s*(.+)$/i);
  if(m) return {block:m[1].trim(), district:m[2].trim().replace(/-\d+$/,"").trim()};
  return {block:"", district:addr};
}
function biRun(){
  const raw=(document.getElementById("bi-raw")?.value ?? BI.raw ?? "");
  BI.raw=raw;
  const lines=raw.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  let imported=0, dup=0, ocr=0, errors=0;
  const errorRows=[], dupRows=[];
  let list=[...scWorking().map(s=>({...s}))];
  const findDup=(udise,name)=>{
    if(udise) { const byU=list.findIndex(s=>(s.udise||"").trim()===udise); if(byU!==-1) return byU; }
    const byN=list.findIndex(s=>(s.name||"").trim().toUpperCase()===name);
    return byN;
  };
  lines.forEach(line=>{
    const parts=line.split("|").map(p=>p.trim());
    if(parts.length<3 || !parts[0] || !parts[2]){ errors++; errorRows.push(line); return; }
    const nameRaw=parts[0], addrRaw=parts[1]||"", udiseRaw=parts[2], phoneRaw=(parts[3]||"").trim();
    // Rule: Convert School Name to consistent uppercase; trim spaces.
    const name=nameRaw.replace(/\s+/g," ").trim().toUpperCase();
    // Rule: Preserve Address formatting — stored as given, only trimmed.
    const address=addrRaw;
    const udise=udiseRaw.replace(/\s+/g,"");
    const {block,district}=biAddrParts(address);
    // OCR normalization: a bare/short token like "91" (ISD code fragment) is not
    // a usable 10-digit mobile number — strip it rather than store bad data.
    let mobile="";
    if(/^\d{10}$/.test(phoneRaw)){
      mobile=phoneRaw;
    } else if(phoneRaw){
      ocr++; // truncated/garbled phone fragment normalized away
    }
    const idx=findDup(udise,name);
    if(idx!==-1){
      const existing=list[idx];
      list[idx]={...existing,name,udise:udise||existing.udise,address,block,district,mobile:mobile||existing.mobile};
      dup++; dupRows.push(`${name} (UDISE ${udise})`);
    } else {
      list.push({id:uid(),name,udise,block,district,address,mobile,active:true});
      imported++;
    }
  });
  SC.draft=list; SC.dirty=true;
  BI.result={total:lines.length,imported,dup,ocr,errors,errorRows,dupRows};
  toast(`Import complete — ${imported} imported, ${dup} duplicates overwritten`,"ok");
  gP("schools");
}

V42.openDB = function(){
  return new Promise((resolve,reject)=>{
    if(V42.db) return resolve(V42.db);
    if(!window.indexedDB) return reject(new Error("IndexedDB is not supported by this browser"));
    const req=indexedDB.open(V42.dbName,V42.dbVersion);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if(!db.objectStoreNames.contains("queue")){
        const st=db.createObjectStore("queue",{keyPath:"id"});
        st.createIndex("status","status");
        st.createIndex("createdAt","createdAt");
      }
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
    };
    req.onsuccess=e=>{V42.db=e.target.result;resolve(V42.db);};
    req.onerror=()=>reject(req.error||new Error("IndexedDB open failed"));
  });
};
V42.idbGet=function(store,key){return V42.openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));};
V42.idbSet=function(store,key,value){return V42.openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).put(value,key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);}));};
V42.idbDelete=function(store,key){return V42.openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).delete(key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);}));};
V42.idbAll=function(store){return V42.openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));};

V42.migrateLocalStorage = async function(){
  await V42.openDB();
  const marker=await V42.idbGet("meta","migration_v42");
  if(marker && marker.completed) return false;
  let imported=0;
  for(const k of V42.stateKeys){
    const existing=await V42.idbGet("kv",k);
    if(existing) continue;
    const prop=V42.keyMap[k];
    const value=A[prop];
    if(typeof value!=="undefined"){
      await V42.writeStateKey(k,value); imported++;
    }
  }
  await V42.idbSet("meta","migration_v42",{completed:true,from:V42.previousVersion,to:V42.version,at:new Date().toISOString(),keys:imported});
  return imported>0;
};
V42.hydrateFromIDB = async function(){

    await V42.openDB();
    const migrated=await V42.migrateLocalStorage();
    if(!migrated){
      for(const k of V42.stateKeys){
        const rec=await V42.idbGet("kv",k);
        if(!rec || typeof rec.value==="undefined") continue;
        const prop=V42.keyMap[k];
        if(prop && typeof A[prop]!=="undefined") A[prop]=rec.value;
      }
    }
    const sess=await V42.idbGet("meta","session");
    if(sess && sess.user && sess.expiresAt && Date.now()<sess.expiresAt){
      A.loggedIn=true; A.currentUser=sess.user;
    }
    V42.ready=true;
  }catch(e){
    console.warn("v4.42 IndexedDB hydration failed; localStorage fallback remains active",e);
    V42.ready=true;
  }finally{V42.hydrating=false;}
};

V42.enqueueCurrentState = async function(){
  const items=[
    ['f',A.firm],['sr',A.series],['rt',A.rates],['hd',A.heads],
    ['it',A.items],['sc',A.schools],['iv',A.invoices],['us',A.users],

  ];
  let added=0;
  let existing=[];
  try{ existing=await V42.queue(); }catch(_){ existing=[]; }
  for(const [key,value] of items){
    const hash=typeof _driveHash==='function'?_driveHash(value):JSON.stringify(value);
    const pendingSame=existing.some(op=>op && op.key===key && op.status!=='synced');
    const confirmedHash=localStorage.getItem('cloud_confirmed_hash_'+key)||'';

  }
  return added;
};

V42.acceptGoogleCredential = async function(credential){

    if(payload.aud && V42.googleClientId && payload.aud!==V42.googleClientId) throw new Error("Google client mismatch");
    const user={id:payload.sub,name:payload.name||payload.email||"Google User",email:(payload.email||"").toLowerCase(),picture:payload.picture||"",googleSub:payload.sub,signedInAt:new Date().toISOString(),deviceId:V42.deviceId,authMethod:"google"};
    CLOUD.user=user; CLOUD.ready=true; CLOUD.token=credential; V42.idToken=credential;
    await V42.saveSession(user);

V42.backend = async function(action,payload){
  const body={action,idToken:V42.idToken||CLOUD.token||null,payload:payload||{},appVersion:V42.version,deviceId:V42.deviceId,user:(CLOUD.user||null)};

  // ID tokens are short-lived. Before cloud work, try a silent GIS refresh;
  // if the server still reports an expired credential, refresh once and retry
  // the SAME operation. No logout/login is required for this recovery path.
  const perform=async()=>{
    if(V42_IS_HOSTED){
      return await new Promise((resolve,reject)=>{
        google.script.run
          .withSuccessHandler(d=>{
            try{if(!d||!d.ok)throw new Error((d&&d.error)||'API request failed');resolve(d);}catch(e){reject(e);}
          })
          .withFailureHandler(e=>reject(new Error((e&&e.message)||String(e)||'Apps Script request failed')))
          .apiRequest(body);
      });
    }

    const endpoints=V42_transportEndpoints();
    if(!endpoints.length) throw new Error('Master API endpoint not configured');
    const failures=[];

    const bridgeOnce=async(url)=>{
      let frame=null;
      try{
        frame=await new Promise((resolve,reject)=>{
          const f=document.createElement('iframe');
          f.id='mdm-api-bridge-frame';
          f.setAttribute('aria-hidden','true');
          f.style.cssText='position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none;';
          let settled=false;
          const cleanup=()=>{window.removeEventListener('message',onReady);clearTimeout(timer);};
          const fail=err=>{if(settled)return;settled=true;cleanup();try{f.remove();}catch(_){}reject(err);};
          const timer=setTimeout(()=>fail(new Error('Master API bridge did not load. Check Apps Script Web App deployment access.')),10000);
          const onReady=ev=>{
            if(ev.source!==f.contentWindow || ev.data?.type!=='mdm-api-bridge-ready') return;
            if(settled)return;settled=true;cleanup();resolve(f);
          };
          window.addEventListener('message',onReady);
          document.body.appendChild(f);
          f.src=url+(url.indexOf('?')>=0?'&':'?')+'bridge=1&v='+encodeURIComponent(V42.version||'4.51')+'&_='+Date.now();
        });

        const requestId='req_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        return await new Promise((resolve,reject)=>{
          let done=false;
          const timeout=setTimeout(()=>finish(reject,new Error('Master API bridge timeout')),25000);
          const finish=(fn,v)=>{if(done)return;done=true;window.removeEventListener('message',onMessage);clearTimeout(timeout);fn(v);};
          const onMessage=ev=>{
            if(ev.source!==frame.contentWindow || ev.data?.type!=='mdm-api-response' || ev.data.requestId!==requestId)return;
            if(ev.data.ok && ev.data.result?.ok) finish(resolve,ev.data.result);
            else finish(reject,new Error(ev.data.error||ev.data.result?.error||'API request failed'));
          };
          window.addEventListener('message',onMessage);
          frame.contentWindow.postMessage({type:'mdm-api-request',requestId,body},'*');
        });
      }finally{try{frame?.remove();}catch(_){} }
    };

    for(const url of endpoints){
      // A transient iframe/deployment wake-up failure must not fail Backup Now
      // on the first attempt. Recreate the bridge instead of reusing a poisoned one.
      let lastBridgeError=null;
      for(let attempt=1;attempt<=3;attempt++){
        try{
          const result=await bridgeOnce(url);
          if(url===V42_DEFAULT_API_URL && V42_SAFE_STORED_API_URL && V42_SAFE_STORED_API_URL!==url){
            V42.apiUrl=url;try{localStorage.setItem('mdm_api_url',url);}catch(_){}
          }
          return result;
        }catch(e){
          lastBridgeError=e;
          if(attempt<3) await new Promise(r=>setTimeout(r,700*attempt));
        }
      }
      failures.push(url+': '+(lastBridgeError?.message||lastBridgeError));

      // Direct POST is only a fallback for a deployment that explicitly allows
      // readable CORS responses. No no-cors request is ever treated as success.
      try{
        const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',credentials:'omit'});
        if(!r.ok) throw new Error('API HTTP '+r.status);
        const d=await r.json();
        if(!d.ok) throw new Error(d.error||'API request failed');
        return d;
      }catch(e){failures.push(url+' direct: '+(e?.message||e));}
    }
    throw new Error('Master API transport failed: '+failures.join(' | '));
  };

  // Fast local expiry check before first transport attempt.
  if(action!=='auth' && isGoogleUser(CLOUD.user) && !V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,90)){
    const refreshed=await V42.refreshGoogleCredential();
    if(!refreshed) throw new Error('Google session expired — automatic credential refresh was unavailable');
  }

  try{
    return await perform();
  }catch(firstError){
    // Server-side tokeninfo can reject a token that looked valid locally. In
    // that case refresh once and replay the exact operation; do not force login.
    if(action!=='auth' && isGoogleUser(CLOUD.user) && /token|credential|authentication/i.test(String(firstError?.message||''))){
      try{
        const refreshed=await V42.refreshGoogleCredential();
        if(refreshed && V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,30)) return await perform();
      }catch(_){ }
    }
    throw firstError;
  }
};
V42.ensureBackendAuth = async function(){

async function betaCleanTransactionalBaseline(){
  const DONE="mdm_erp_beta_clean_idb_v1";
  try{
    if(localStorage.getItem(DONE)) return false;
    await V42.openDB();

    // Canonical invoice transaction state.
    for(const key of ["iv","al","dp","rv","ib","iu"]){
      await V42.idbDelete("kv",key);
    }

    // Remove every durable sync operation. This includes pending, uploading
    // and previously-synced queue records created during development/testing.
    const queue=await V42.idbAll("queue");
    for(const op of queue){
      if(op && op.id!=null) await V42.idbDelete("queue",op.id);
    }

    // Remove old migration/session/recovery transaction metadata, but do NOT
    // touch the School Master ("sc") or master/configuration keys.
    for(const key of [
      "migration_v42",
      "lastLocalSnapshot",
      "pre_restore_backup"
    ]){
      await V42.idbDelete("meta",key);
    }

    // Ensure the next V42 hydration does not import old invoice localStorage
    // state. Master data remains untouched.
    V42._svOriginal("iv",[]);
    V42._svOriginal("al",[]);
    V42._svOriginal("dp",[]);
    V42._svOriginal("rv",[]);
    V42._svOriginal("ib",{});
    V42._svOriginal("iu",[]);

    // Reset cloud-sync bookkeeping only; credentials/configuration remain.
    try{localStorage.removeItem("gdrive_inv_hashes");}catch(e){}
    try{localStorage.removeItem("cloud_last_backup");}catch(e){}

    localStorage.setItem(DONE,"1");
    return true;
  }catch(e){
    console.error("BETA transactional baseline reset failed:",e);
    throw e;
  }
}

async function bootstrapV42(){
  /*
   * Startup safety/performance:
   * 1) Never run the old transactional baseline cleanup automatically.
   *    That routine deletes canonical invoice/transaction keys and can block
   *    the first render on a fresh WebView origin.
   * 2) Paint the existing login UI immediately, then hydrate IndexedDB/session
   *    asynchronously. If a valid session is found, switch to Dashboard.
   * This is startup orchestration only; invoice/business logic is untouched.
   */
  try{ pgLogin(); }catch(e){
    console.error("Initial login render failed:",e);
    const app=document.getElementById("app");
    if(app)app.innerHTML='<div style="padding:32px;font:600 16px system-ui;color:#172033">MDM ERP is starting…</div>';
  }

  try{await V42.hydrateFromIDB();}catch(e){console.warn("IDB hydration deferred:",e);}
  try{
    const sess=await V42.getSession();
    if(sess && sess.user && sess.expiresAt>Date.now()){
      A.loggedIn=true;A.currentUser=sess.user;CLOUD.user=sess.user;CLOUD.ready=true;
      localStorage.setItem("cloud_user",JSON.stringify(sess.user));
    }
  }catch(e){console.warn("Session hydration deferred:",e);}

  V42.installUI();

  if(A.loggedIn){
    renderShell();
    gP("dashboard");
  } else {
    // Login was already painted synchronously; no second full render needed.
    // The Google-login enhancement is installed by the existing startup hook.
  }

  if(navigator.onLine) setTimeout(()=>V42.flushQueue(),1200);
  setInterval(()=>{ if(navigator.onLine && CLOUD.user) V42.flushQueue(); }, 5*60*1000);
}

function admRoster() {

  if(RT.show){

          }).join("")}
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:5px;border:1px solid ${(f.schedule[day]||[]).includes("fruit")?"var(--tl)":"var(--bd)"};background:${(f.schedule[day]||[]).includes("fruit")?"var(--tlt)":"#fff"}"><input type="checkbox" data-day="${day}" data-head="fruit" ${(f.schedule[day]||[]).includes("fruit")?"checked":""} onchange="rtToggle(this)" style="width:13px;height:13px"/>Fruit/Egg</label>

          </div>

    <tbody>${rosters.length===0?`<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--txl)">No rosters yet. Create a weekly schedule template to assign to schools.</td></tr>`:
      rosters.map((r,i)=>
        `<tr><td style="color:var(--txl)">${i+1}</td><td style="font-weight:700">${ec(r.name)}</td><td style="font-size:11.5px;color:var(--txl)">${ec(r.description)}</td>`

      ).join("")}

  </div>${modal}`;

function rtToggle(el){
  const day=el.getAttribute("data-day"), head=el.getAttribute("data-head");
  const sched=RT.sf.schedule;
  if(!sched[day])sched[day]=[];
  if(el.checked){if(!sched[day].includes(head))sched[day].push(head);}
  else{sched[day]=sched[day].filter(h=>h!==head);}
  // Re-render just the checkbox label styling
  el.parentElement.style.border=`1px solid ${el.checked?(head==="fruit"?"var(--tl)":"var(--sf)"):"var(--bd)"}`;
  el.parentElement.style.background=el.checked?(head==="fruit"?"var(--tlt)":"var(--slt)"):"#fff";
}
function rtAdd(){RT.eid=null;RT.sf={name:"",description:"",active:true,schedule:{monday:[],tuesday:[],wednesday:[],thursday:[],friday:[],saturday:[],sunday:[]}};RT.show=true;gP("admin");}

function rtSave(){
  const name=(document.getElementById("rt-name")||{}).value?.trim()||"";
  if(!name){toast("Roster name required","err");return;}
  const item={...RT.sf,id:RT.eid||uid(),name,description:(document.getElementById("rt-desc")||{}).value?.trim()||"",active:document.getElementById("rt-active")?.checked!==false,updatedAt:new Date().toISOString(),updatedBy:A.currentUser?.name||"admin"};
  if(!RT.eid)item.createdAt=new Date().toISOString();
  const upd=RT.eid?A.ro.map(r=>r.id===RT.eid?item:r):[...A.ro,item];
  sv("ro",upd);RT.show=false;
  auditLog(RT.eid?"UPDATE":"CREATE","roster",item.id,(RT.eid?"Updated":"Created")+" roster: "+name,{after:{name,schedule:item.schedule}});
  toast(RT.eid?"Roster updated":"Roster created","ok");gP("admin");
}
function rtDel(id){
  if(!confirm("Delete this roster? Schools using it will be unlinked."))return;
  const r=A.ro.find(x=>x.id===id);
  sv("ro",A.ro.filter(x=>x.id!==id));
  auditLog("DELETE","roster",id,"Deleted roster: "+(r?r.name:""),null);
  toast("Roster removed","ok");gP("admin");
}

function fnSampleCtx(){ return {invNo:"MSE2526-472", schoolName:"Govt MS Rampur", month:"August", year:"2026", date:"2026-08-04", net:38425}; }
function slugFn(s){ return (s||"").toString().toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function fnSanitize(s){ return (s||"").toString().replace(/[\\/:*?"<>|]/g,"").trim(); }
function fnBuildName(docType, ctx, sOverride){
  const s = sOverride || A.as2 || {};
  const fmt = s.fnFormat || "standard";
  const monthAbbr = (ctx.month||"").slice(0,3);
  const rid = ctx._rid || "38425";
  const fy = ctx.year ? (ctx.year+"-"+String((+ctx.year+1)).slice(-2)) : "";
  if(fmt==="detailed"){
    const schoolSlug=fnSanitize(ctx.schoolName).replace(/-+/g,"-").slice(0,48);
    return `${ctx.invNo}${schoolSlug?"_"+schoolSlug:""}_${monthAbbr}-${ctx.year}.pdf`;
  }
  if(fmt==="custom"){
    const tmpl = s.fnTemplate || "{InvoiceNo}_{Month}_{Amount}";
    let name = tmpl
      .replace(/\{InvoiceNo\}/gi, ctx.invNo||"")
      .replace(/\{SchoolName\}/gi, fnSanitize(ctx.schoolName))
      .replace(/\{Month\}/gi, `${monthAbbr}-${ctx.year}`)
      .replace(/\{Amount\}/gi, String(Math.round(ctx.net||0)))
      .replace(/\{FinancialYear\}/gi, fy)
      .replace(/\{Date\}/gi, ctx.date||"");
    if(!name.trim()) name = ctx.invNo||"Document";
    return name.trim() + ".pdf";
  }
  // standard (default): keep the share filename human-readable and tied
  // only to the invoice identity. The old hard-coded RID (38425) was a
  // sample value and leaked into real WhatsApp attachments.
  const schoolSlug=fnSanitize(ctx.schoolName).replace(/-+/g,"-").slice(0,48);
  return `${ctx.invNo}${schoolSlug?"_"+schoolSlug:""}_${monthAbbr}-${ctx.year}.pdf`;
}

// ══════════════════════════════════════════════════════════════════
// CONCEPT V1 — PREPARE / RETAIN / SHARE PDF ARCHITECTURE
// Share-PDF renderer is intentionally isolated from the existing print engine.
// The approved desktop print path remains untouched.
// PDF is generated once, validated, retained in memory, and the exact same
// File object is reused by Share. No html2canvas / PNG / addImage pipeline.
let _pdfLibsPromise=null;
function loadPdfLibs(){
  if(_pdfLibsPromise)return _pdfLibsPromise;
  _pdfLibsPromise=new Promise((resolve,reject)=>{
    if(window.jspdf){resolve();return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("jspdf-load-failed"));
    document.head.appendChild(s);
  });
  return _pdfLibsPromise;
}

// Prepared-PDF cache: the exact File generated here is reused by Share.
const _invoicePdfCache=new Map();
function invoicePdfCacheKey(inv){
  return [inv?.id,inv?.invNo,inv?.date,inv?.net,inv?.status,inv?.revisedAt,inv?.updatedAt].join("|");
}
function clearInvoicePdfCache(id){
  if(!id){_invoicePdfCache.clear();return;}
  for(const [k] of _invoicePdfCache){if(k.startsWith(String(id)+"|"))_invoicePdfCache.delete(k);}
}

function _pdfEsc(v){return String(v??"").replace(/[\r\n]+/g," ").trim();}
function _pdfMoney(v){return Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function _pdfAlign(v){return v==="center"||v==="right"||v==="justify"?v:"left";}
function _pdfRgb(doc,method,color,fallback){
  const c=Array.isArray(color)&&color.length>=3?color:fallback;
  if(method==="text")doc.setTextColor(Number(c[0])||0,Number(c[1])||0,Number(c[2])||0);
  else if(method==="fill")doc.setFillColor(Number(c[0])||0,Number(c[1])||0,Number(c[2])||0);
  else doc.setDrawColor(Number(c[0])||0,Number(c[1])||0,Number(c[2])||0);
}
function _pdfText(doc,text,x,y,maxW,size=6,opts={}){
  doc.setFontSize(size);
  doc.setFont("helvetica",opts.bold?"bold":"normal");
  const lines=doc.splitTextToSize(_pdfEsc(text),maxW);
  const align=_pdfAlign(opts.align);
  doc.text(lines,x,y,{align,baseline:"top"});
  return lines.length*(size*0.35+1.15);
}
function _pdfLine(doc,x1,y1,x2,y2,w=.25){doc.setLineWidth(w);doc.line(x1,y1,x2,y2);}
function _pdfRect(doc,x,y,w,h,fill=false){if(fill){doc.setFillColor(245,247,250);doc.rect(x,y,w,h,"F");}doc.setDrawColor(130,140,150);doc.rect(x,y,w,h,"S");}
function _pdfCell(doc,text,x,y,w,h,size=5.1,align="left",bold=false){
  doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(18,32,47);
  const a=_pdfAlign(align), pad=1.1, max=Math.max(3,w-pad*2), lines=doc.splitTextToSize(_pdfEsc(text),max);
  const lineH=Math.max(2.5,size*0.36); const shown=lines.slice(0,Math.max(1,Math.floor((h-.6)/lineH)));
  let yy=y+(h-lineH*shown.length)/2;
  shown.forEach(line=>doc.text(line,x+(a==="right"?w-pad:a==="center"?w/2:pad),yy,{align:a,baseline:"top"}));
}

async function buildInvoicePdfFile(inv,opts={}){
  const key=invoicePdfCacheKey(inv);
  if(!opts.force && _invoicePdfCache.has(key))return _invoicePdfCache.get(key);
  await loadPdfLibs();
  if(!inv?.mergedItems?.length)throw new Error("No invoice rows available for PDF");

  // ══════════════════════════════════════════════════════════════════
  // MASTER INVOICE RENDERER — SURGICAL V5
  // Source of truth: supplied "Invoice Format Layout-MS ENTERPRISES.pdf".
  // This renderer is ONLY for the Main Invoice. Annexures/GST reports

}

async function sendBatchShareViaExistingChannel(channel,invoices,message){
  const payload=await buildBatchSharePayload(invoices);

}

async function sendBatchShareChannel(channel){
  const selected=batchSelectedInvoices();
  if(!selected.length){toast("Select at least one invoice to share.","err");return;}
  if(_sharePrepBusy)return;

  const normalized=String(channel||"device").toLowerCase();
  const msg=document.getElementById("batch-share-msg")?.value || buildBatchShareMessage(
    selected,_batchShareState?.schoolName||"Selected School"
  );

  _sharePrepBusy=true;
  try{
    // Always prepare the exact selected PDFs in the same order as the batch list.
    const files=[];
    for(const inv of selected){
      const file=await prepareInvoicePdf(inv.id);
      if(!fileMatchesInvoice(file,inv))throw new Error("Prepared PDF does not match "+inv.invNo);
      files.push(file);
    }

    // Reuse the existing single-share Web Share/native path whenever possible.
    // Batch only changes the payload from one invoice to the selected invoice pack.
    if(normalized==="telegram" || normalized==="email" || normalized==="device"){
      if(!(navigator.share && navigator.canShare && navigator.canShare({files,text:msg}))){
        // Fall back to the native/device share bridge if the project exposes it.
        if(window.AndroidShare?.shareFilesWithText){
          const payload=[];
          for(const file of files){
            payload.push({
              name:file.name||"invoice.pdf",
              type:file.type||"application/pdf",
              file:file
            });
          }
          await window.AndroidShare.shareFilesWithText(payload,msg);
        }else{
          throw new Error("This device does not support multi-file sharing.");
        }
      }else{
        await navigator.share({
          files,
          title:`MDM Invoice Pack — ${_batchShareState?.schoolName||"Selected School"}`,
          text:msg
        });
      }

      const method=normalized==="telegram"?"TELEGRAM":normalized==="email"?"EMAIL":"DEVICE_SHARE";
      selected.forEach(inv=>markDeliveryState(inv.id,method));
      auditLog("SHARE","school",_batchShareState?.schoolId||selected[0]?.schoolId||null,
        `Batch ${method} share completed for ${selected.length} selected invoices.`,
        {invoiceIds:selected.map(i=>i.id),channel:normalized});
      toast(`Batch ${normalized==="device"?"share":normalized+" share"} opened`,"ok");
      document.getElementById("batch-share-dlg")?.remove();
      _batchShareState=null;
      return;
    }

    throw new Error("Unsupported batch share channel.");
  }catch(err){
    if(err?.name!=="AbortError")toast(`${normalized} batch share failed: `+(err.message||"Unknown error"),"err");
  }finally{
    _sharePrepBusy=false;
  }
}

async function shareWithPdf(id,channel){
  if(_sharePrepBusy)return;
  const inv=A.invoices.find(i=>i.id===id);
  if(!inv){toast("Invoice not found","err");return;}
  if(!inv.mergedItems){toast("No PDF data for this invoice","err");return;}
  const taEl=document.getElementById("shr-msg-"+id);
  const msg=taEl?taEl.value:renderMsgTemplate(currentShareMsgTemplate(),inv);
  if(document.getElementById("shr-savedef-"+id)?.checked){
    const settUpd={...(A.sett||ST0),shareMsgTemplate:msg};
    sv("st",settUpd);A.sett=settUpd;
  }

  _sharePrepBusy=true;
  setShareBusy(id,true,preparedInvoicePdfReady(id)?"Using prepared PDF...":"Generating and validating PDF...");

  // WhatsApp Android is the special case. Older versions of this project already
  // used the host bridge method AndroidShare.sharePdf(base64, filename, message).
  // The V1.2 change incorrectly required a different method name
  // (sharePdfWithText), so an existing host bridge was never reached and the
  // browser fell back to navigator.share(). WhatsApp then kept the PDF but
  // discarded the caption. Restore the established bridge contract and pass the
  // message as the THIRD argument.
  let clipboardOk=false;
  if(channel==="whatsapp"){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(msg);
        clipboardOk=true;
      }
    }catch(e){/* clipboard is only a safety net */}
  }

  try{
    const file=await prepareInvoicePdf(id);
    if(!fileMatchesInvoice(file,inv))throw{code:"identity"};

    if(channel==="whatsapp" && window.AndroidShare){
      const buf=await file.arrayBuffer();
      const bytes=new Uint8Array(buf);
      let binary="";
      const chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
      const b64=btoa(binary);

      // CONCEPT V1 — strict native bridge contract.
      // WhatsApp must receive ONE ACTION_SEND payload containing both:
      // EXTRA_STREAM = the exact prepared PDF
      // EXTRA_TEXT   = the exact invoice message
      // Do NOT use the legacy sharePdf(base64, filename) method here because
      // the delivered Android host has been proven to send the PDF but drop text.
      if(typeof window.AndroidShare.sharePdfWithText!=="function")
        throw{code:"native_whatsapp_bridge_required"};
      const result=window.AndroidShare.sharePdfWithText(b64,file.name,msg);
      if(result&&typeof result.then==="function")await result;

      document.getElementById("shr-dlg")?.remove();
      toast("WhatsApp share opened with PDF + message","ok");
      markDeliveryState(id,"WHATSAPP");
      auditLog("SHARE","invoice",id,"Shared prepared PDF + message via native WhatsApp bridge: "+inv.invNo,null);
      return;
    }

    const webFileShareSupported=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file],text:msg}));
    if(webFileShareSupported){
      await navigator.share({files:[file],title:"MDM Invoice "+inv.invNo,text:msg});
      document.getElementById("shr-dlg")?.remove();
      toast("Invoice message + prepared PDF share opened","ok");
      markDeliveryState(id,channel.toUpperCase());
      auditLog("SHARE","invoice",id,"Shared prepared PDF + message via Web Share: "+inv.invNo,null);
      return;
    }

    throw{code:"unsupported"};
  }catch(err){
    if(err&&err.name==="AbortError"){}
    else if(err&&err.code==="identity")toast("Prepared PDF does not match this invoice.","err")
    else if(err&&err.code==="native_whatsapp_bridge_required"){
      // Never fall back to navigator.share() for WhatsApp: on this Android/WhatsApp
      // combination it can deliver the PDF while dropping EXTRA_TEXT.
      toast("WhatsApp native bridge is required for PDF + message sharing. The PDF was NOT sent by the fallback path.","err");
      auditLog("SHARE","invoice",id,"WhatsApp blocked: native sharePdfWithText bridge is missing; no PDF-only fallback used.",null);
    }
    else if(err&&err.code==="unsupported")toast(clipboardOk?"PDF sharing is unsupported here — message copied to clipboard.":"This device cannot attach files and text through its current share interface.","err")
    else toast("PDF share failed: "+(err.message||"Unknown error"),"err");
  }finally{
    _sharePrepBusy=false;
    setShareBusy(id,false);
  }
}

// Android native bridge contract — Concept V1 / v4.28:
// sharePdfWithText(base64Pdf, filename, message)
// REQUIRED native behavior:
//   1) decode base64Pdf to a temporary .pdf file
//   2) expose it through a FileProvider content:// URI
//   3) create ONE ACTION_SEND intent with:
//        type = application/pdf
//        EXTRA_STREAM = PDF content URI
//        EXTRA_TEXT   = message
//   4) grant URI read permission
//   5) explicitly target com.whatsapp when this method is used for WhatsApp
//   6) startActivity(intent)
// No PDF regeneration is permitted here.
// The legacy sharePdf(base64, filename) method MUST NOT be used for WhatsApp.

// ══════════════════════════════════════════════════════════════════
// Concept V1.6 — WhatsApp reliable two-step share (text first, PDF second)
// ══════════════════════════════════════════════════════════════════
// v2.1 — SHARE DIALOG (Web Share API + WhatsApp + Email + Telegram)
// ══════════════════════════════════════════════════════════════════

function doImp() {
  const inp = document.createElement("input");
  inp.type="file";inp.accept=".json";
  inp.onchange = ev=>{
    const file = ev.target.files[0];if(!file)return;
    const r = new FileReader();
    r.onload = e=>{
      try{
        const d = JSON.parse(e.target.result);
        if(!d.invoices||!d.firm){toast("Invalid backup file — missing required data","err");return;}
        if(!confirm(`Restore backup from ${d.exportedAt?new Date(d.exportedAt).toLocaleString("en-IN"):"unknown date"}?\n\nThis will replace ALL current data.\n\nInvoices: ${d.invoices.length} | Schools: ${d.schools?.length||0}\n\nThis cannot be undone.`))return;
        // Restore all keys
        if(d.firm)   sv("f",d.firm);
        if(d.series) sv("sr",d.series);
        if(d.rates)  sv("rt",d.rates);
        if(d.heads)  sv("hd",d.heads);
        if(d.items)  sv("it",d.items);
        if(d.schools)sv("sc",d.schools);
        if(d.invoices)sv("iv",d.invoices);
        if(d.invoiceUndoArchive)sv("iu",d.invoiceUndoArchive);
        if(d.users)  sv("us",d.users);
        if(d.sett)   sv("st",d.sett);
        if(d.ro)     sv("ro",d.ro);
        if(d.lpg)    sv("lpg",d.lpg);
        if(d.alm)    sv("alm",d.alm);
        if(d.gd)     sv("gd",d.gd);
        if(d.as2)    sv("as2",d.as2);
        if(d.al)     sv("al",d.al);
        // Re-init A.sett
        A.sett = A.st||ST0;
        auditLog("IMPORT","backup","full",`Backup restored — ${d.invoices.length} invoices, ${d.schools?.length||0} schools`,null);
        toast("Backup restored successfully! Reloading...","ok");
        setTimeout(()=>window.location.reload(),1200);
      }catch(err){toast("Restore failed: "+err.message,"err");}
    };
    r.readAsText(file);
  };
  inp.click();
}

// LEVEL 2 — THEME DESIGN ENGINE
// Application appearance is separate from Main Invoice PDF theme.
// Product-table font controls are safe-range constrained and do not
// alter the locked master PDF geometry.
// ═══════════════════════════════════════════════════════════════════
const INVOICE_THEME_PRESETS={
  master:{name:"Master Blue",seed:"#9AB8D6",text:"auto",border:"#CCD6E3"},
  navy:{name:"Premium Navy",seed:"#17356F",text:"auto",border:"#B8C7DF"},
  emerald:{name:"Emerald",seed:"#176B4B",text:"auto",border:"#C5D8CF"},
  teal:{name:"Professional Teal",seed:"#0F5E66",text:"auto",border:"#C6DDE0"},
  orange:{name:"Warm Orange",seed:"#9A4D0B",text:"auto",border:"#E4D0BC"},
  purple:{name:"Royal Purple",seed:"#5B3A9D",text:"auto",border:"#D9D0EA"},
  red:{name:"Classic Red",seed:"#8B1E1E",text:"auto",border:"#E3CCCC"},
  slate:{name:"Modern Slate",seed:"#34495E",text:"auto",border:"#C7D0D9"},
  forestSlate:{name:"Deep Forest Slate",seed:"#39565C",text:"auto",border:"#C9D4D7"},
  corporateNavy:{name:"Corporate Navy",seed:"#0E447D",text:"auto",border:"#C4D1E0"}
};
function hexToRgb(h){h=String(h||"").trim().replace(/^#/i,"");if(h.length===3)h=h.split("").map(x=>x+x).join("");if(!/^[0-9a-f]{6}$/i.test(h))return null;return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToHex(rgb){return "#"+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();}
function relLum(rgb){const a=rgb.map(v=>v/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*a[0]+.7152*a[1]+.0722*a[2];}
function contrastRatio(a,b){const A=relLum(a),B=relLum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05);}
function smartHeaderText(bg,choice){if(choice!=="auto")return choice;const rgb=hexToRgb(bg)||[154,184,214];return contrastRatio(rgb,[255,255,255])>=4.5?"#FFFFFF":"#111827";}
function mixRgb(a,b,t){return [Math.round(a[0]*(1-t)+b[0]*t),Math.round(a[1]*(1-t)+b[1]*t),Math.round(a[2]*(1-t)+b[2]*t)];}
function invoiceThemeFamily(seedHex){
  const seed=hexToRgb(seedHex)||[154,184,214];
  // One base/reference color automatically generates the complete invoice family.
  // Dark = major headers; Medium = 60% toward Light; Light = content card.
  const dark=mixRgb(seed,[0,0,0],.55);
  const light=mixRgb(seed,[255,255,255],.72);
  const medium=mixRgb(dark,light,.60);
  return {seed:rgbToHex(seed),dark:rgbToHex(dark),medium:rgbToHex(medium),light:rgbToHex(light)};
}
function customThemeFamily(primary,secondary,tertiary){
  const p=hexToRgb(primary)||[154,184,214];
  const autoSecondary=rgbToHex(mixRgb(p,[255,255,255],.40));
  const autoTertiary=rgbToHex(mixRgb(p,[255,255,255],.70));
  return {seed:rgbToHex(p),dark:rgbToHex(primary||p),medium:secondary&&hexToRgb(secondary)?rgbToHex(secondary):autoSecondary,light:tertiary&&hexToRgb(tertiary)?rgbToHex(tertiary):autoTertiary};
}
function invoiceTheme(){
  const base={...ST0.themeDesign,...(A.sett?.themeDesign||{})};
  const p=INVOICE_THEME_PRESETS[base.invoicePreset];
  if(base.invoicePreset&&base.invoicePreset!=="custom"&&p){
    const fam=invoiceThemeFamily(p.seed);
    return {...base,invoicePreset:base.invoicePreset,themeSeed:p.seed,headerBg:fam.light,accent:fam.dark,highlight:fam.light,border:p.border,headerText:p.text,_themeFamily:fam};
  }
  if(base.invoicePreset==="custom" || base.customTheme){
    const fam=customThemeFamily(base.customPrimary||base.themeSeed||base.accent,base.customSecondary,base.customTertiary);
    return {...base,invoicePreset:"custom",themeSeed:fam.seed,headerBg:fam.light,accent:fam.dark,highlight:fam.light,_themeFamily:fam};
  }
  if(base.themeSeed){
    const fam=invoiceThemeFamily(base.themeSeed);
    return {...base,headerBg:fam.light,accent:fam.dark,highlight:fam.light,_themeFamily:fam};
  }
  return base;
}
function invoiceThemeDarkest(t){return hexToRgb(t._themeFamily?.dark||t.accent)||[31,72,111];}
function invoiceThemeMedium(t){return hexToRgb(t._themeFamily?.medium)||mixRgb(invoiceThemeDarkest(t),hexToRgb(t.headerBg)||[154,184,214],.60);}
function currentInvoiceThemeForUi(){const t=invoiceTheme();return {bg:t.headerBg,text:smartHeaderText(t.headerBg,t.headerText),accent:t.accent,border:t.border,highlight:t.highlight,borderMode:t.borderMode||"black"};}
function invoiceThemeSaveFromUI(){
  const old={...(A.sett?.themeDesign||ST0.themeDesign)};
  const draft=A._themeDraft||{};
  const preset=draft.invoicePreset||"custom";
  const isCustom=preset==="custom";
  const primary=(document.getElementById("td-accent-hex")||{}).value||draft.customPrimary||old.customPrimary||old.accent;

  gP("settings");
}

function getInvCSS() {
  // Extract CSS from page for use in print frame
  const sheets = Array.from(document.styleSheets);
  let css = "";
  try {
    sheets.forEach(s=>{
      Array.from(s.cssRules||[]).forEach(r=>{ css += r.cssText + "\n"; });
    });
  } catch(e) {
    // Cross-origin fallback — use inline style tag content
    const el = document.querySelector("style");
    if(el) css = el.textContent;
  }
  return css;
}

// Paper sizes in mm, portrait orientation (width x height). Landscape swaps them.
const PAGE_SIZES_MM = {
  A3:      [297, 420],
  A4:      [210, 297],
  A5:      [148, 210],
  B4:      [250, 353],
  B5:      [176, 250],
  Letter:  [215.9, 279.4],
  Legal:   [215.9, 355.6],
  Tabloid: [279.4, 431.8],
  Ledger:  [431.8, 279.4], // same sheet as Tabloid, printed landscape by convention
  Executive: [184.15, 266.7],
};
// Annexure print target is intentionally isolated from the locked Main Invoice renderer.
// Default: A4 portrait. Future modes can be changed here without touching the
// Main Invoice master PDF geometry or its 595 x 841 pt A4 portrait contract.
const ANNEXURE_PRINT_DEFAULT = Object.freeze({pageSize:"A4", orientation:"portrait"});
let ANNEXURE_PRINT_CONFIG = {...ANNEXURE_PRINT_DEFAULT};
function setAnnexurePrintConfig(pageSize, orientation){
  ANNEXURE_PRINT_CONFIG={
    pageSize: PAGE_SIZES_MM[pageSize] ? pageSize : ANNEXURE_PRINT_DEFAULT.pageSize,
    orientation: orientation === "landscape" ? "landscape" : "portrait"
  };
  return {...ANNEXURE_PRINT_CONFIG};
}
function getAnnexurePrintConfig(){ return {...ANNEXURE_PRINT_CONFIG}; }

// Design baseline: documents are laid out for A4's printable width (210mm
// sheet minus 7mm margins each side = 196mm). A4/Letter/Legal/A3/B4/Tabloid/
// Ledger are all >=196mm printable-wide, so they get zoom 1 (no shrinking).
// Only genuinely smaller sheets (A5/B5/Executive) scale down, uniformly.
const DESIGN_WIDTH_MM = 196;

function buildPrintHTML(bodyContent, title, pageSize, orientation) {
  pageSize = PAGE_SIZES_MM[pageSize] ? pageSize : "A4";
  orientation = orientation==="landscape" ? "landscape" : "portrait";
  let [wMM, hMM] = PAGE_SIZES_MM[pageSize];
  if(orientation==="landscape") { const t=wMM; wMM=hMM; hMM=t; }
  const printableWidthMM = wMM - 14; // minus left+right margin (7mm each)
  const zoom = orientation==="portrait" ? Math.min(1, printableWidthMM / DESIGN_WIDTH_MM) : 1;
  const css = getInvCSS();
  return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>${title||"MDM Invoice"}</title>
  <style>
    @page { size: ${wMM}mm ${hMM}mm; margin: 8mm 7mm; }
    * { box-sizing: border-box; }
    html, body { font-family: Arial, sans-serif; font-size: 9.5px; margin: 0; padding: 0; background: #fff; }
    .no-print, .topbar, .sidebar, .shell > aside { display: none !important; }
    ${css}
    /* ── Print-quality & pagination rules ── */
    .print-scale-wrap { zoom: ${zoom}; }
    table { border-collapse: collapse; }
    .ax-table { width:100% !important; table-layout:fixed !important; }
    .ax-table td, .ax-table th { box-sizing:border-box; }
    thead { display: table-header-group; }
    tfoot { display: table-footer-group; }
    tr, td, th { page-break-inside: avoid; break-inside: avoid; }
    .id-sum, .id-bt, .id-meta, .id-sg, .id-wd, .id-bk, .id-hd { page-break-inside: avoid; break-inside: avoid; }
    .doc-page { page-break-after: always; break-after: page; }
    .doc-page:last-child { page-break-after: auto; break-after: auto; }
    @media print {
      html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
    }
