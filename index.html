function printViaFrame(htmlContent, onDone) {
  // Fresh session guarantee: remove ANY leftover print iframes from
  // previous requests (not just one fixed id) before starting a new one,
  // and properly tear down their listeners via their own cleanup().
  document.querySelectorAll('iframe[data-print-frame="1"]').forEach(f=>{
    if(typeof f._cleanup==="function") f._cleanup();
    try{ f.srcdoc=""; }catch(e){}
    if(f.parentNode) f.remove();
  });

  const frameId = "__print_frame_" + Date.now() + "_" + Math.floor(Math.random()*1e6) + "__";
  const iframe = document.createElement("iframe");
  iframe.id = frameId;
  iframe.setAttribute("data-print-frame","1");
  // IMPORTANT: give the frame real, non-zero on-screen dimensions and keep
  // it in front of nothing (no negative z-index) — just parked far off the
  // visible viewport. A near-zero-size / opacity:0 / z-index:-1 frame is
  // what caused the "prints the whole ERP screen" bug: once the browser has
  // to reflow the print layout for a non-default page size (e.g. A4 on a
  // Letter-default browser), some browsers treat a frame with no real paint
  // box as having nothing to print and fall back to printing the top-level
  // document instead. A properly-sized, merely off-screen frame keeps print
  // isolation intact for every paper size.
  iframe.style.cssText = "position:fixed;left:-10000px;top:0;width:850px;height:1200px;border:0;visibility:visible;opacity:.01;pointer-events:none;z-index:2147483647;";

  const cleanup = () => {
    if(cleanup._done) return;
    cleanup._done = true;
    try{ window.removeEventListener("afterprint", winAfterPrint); }catch(e){}
    try{ document.removeEventListener("visibilitychange", onVisChange); }catch(e){}
    try{ iframe.srcdoc = ""; }catch(e){}
    if(iframe.parentNode) iframe.remove();
    if(onDone) onDone();
  };
  // afterprint fires only once the print dialog is actually dismissed
  // (whether the user prints or cancels) — this is what we should key
  // cleanup off of, NOT a fixed timer. A real device's system print
  // dialog (enumerating "Save as PDF", rendering the preview, letting
  // the user browse paper sizes) can easily take longer than a few
  // seconds; a short fixed timeout was destroying the iframe WHILE the
  // dialog was still open. When the user then changed paper size (A4),
  // the browser had to re-render the preview but the iframe was already
  // gone, so it fell back to printing the live top-level page instead.
  const winAfterPrint = () => cleanup();
  // On Android, window.print() hands off to a SEPARATE system Print
  // Activity ("Save as PDF" sheet) outside the webpage entirely, where
  // afterprint can be unreliable. The tab reliably goes hidden while
  // that native UI is in front and becomes visible again the moment
  // the user is done with it (print, save, cancel, or just changing
  // paper size) — so that's the trustworthy cross-platform signal.
  let wentHidden = false;
  const onVisChange = () => {
    if(document.hidden){ wentHidden = true; return; }
    // Keep the print iframe alive while Android's native print activity
    // reflows/returns from the Save-as-PDF sheet. Removing it here can
    // cause Chrome/WebView to fall back to printing the top-level ERP page.
  };
  document.addEventListener("visibilitychange", onVisChange);
  iframe._cleanup = cleanup;

  // Use srcdoc — no new window, no popup permission, works on Android/Samsung/Chrome/Firefox
  iframe.srcdoc = htmlContent;

  iframe.onerror = cleanup;
  iframe.onload = function() {
    try {
      // Small delay to ensure content is rendered before print dialog
      setTimeout(() => {
        try {
          iframe.contentWindow.focus();
          // Listen for afterprint on both the iframe's own window (the
          // spec-correct target) and the top window (some Android
          // WebView/Chrome builds fire it there instead) — whichever
          // fires first wins; cleanup() is idempotent.
          try{ iframe.contentWindow.addEventListener("afterprint", cleanup); }catch(e3){}
          window.addEventListener("afterprint", winAfterPrint);
          iframe.contentWindow.print();
        } catch(e2) {
          // Fallback: blob URL download for Android
          const blob = new Blob([htmlContent], {type:"text/html"});
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "invoice.html";
          document.body.appendChild(a); a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          toast("Saved as file — open and print from browser","ok");
          cleanup();
        }
        // Generous fallback ONLY — catches browsers/WebViews that never
        // fire afterprint or visibilitychange for an iframe-triggered
        // print, or a dialog the user abandoned. Not the primary
        // cleanup path anymore.
        setTimeout(cleanup, 120000);
      }, 600);
    } catch(e) {
      // Absolute fallback — download the file
      const blob = new Blob([htmlContent], {type:"text/html"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "MDM_Invoice.html";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Downloaded — open file and print","ok");
      cleanup();
    }
  };

  document.body.appendChild(iframe);
}

function downloadHTML(htmlContent, filename) {
  // Download as HTML file — user can open in browser and Ctrl+P → Save as PDF
  // This is the most reliable cross-browser PDF download method
  const blob = new Blob([htmlContent], {type: "text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

  let body,docLabel="";if(tab==="annexA"){body=axDoc(c.annexA,c.tA,"Annexure A - Class 1 to 5",sch,inv,inv.invNo);docLabel=" - Annexure A";}else if(tab==="annexB"){body=axDoc(c.annexB,c.tB,"Annexure B - Class 6 to 8",sch,inv,inv.invNo);docLabel=" - Annexure B";}else if(tab==="annexC"){body=axCDoc(c,sch,inv,inv.invNo);docLabel=" - Annexure C";}else{body=gstSummaryDoc(c,sch,inv,inv.invNo);docLabel=" - GST Summary";}
  const title=fnBuildName("Invoice",{invNo:inv.invNo,schoolName:inv.schoolName,month:inv.month,year:inv.year,date:inv.date,net:inv.net}).replace(/\.pdf$/i,"")+docLabel;const fullHTML=buildPrintHTML(body,title,(A.as2||{}).pageSize,(A.as2||{}).orientation);const orig=document.title;document.title=title;toast("Opening print dialog — choose 'Save as PDF' to download","ok");printViaFrame(fullHTML,()=>{document.title=orig;});auditLog("PRINT","invoice",id,"Printed/exported: "+inv.invNo+docLabel,null);setTimeout(()=>trackPrint(id),800);
}

    c = {merged:inv.mergedItems, mTot:inv.mergedTotals, annexA:inv.annexA||[], annexB:inv.annexB||[],
         tA:inv.totalsA||{taxable:0,cgst:0,sgst:0,gross:0,roundOff:0,net:0}, tB:inv.totalsB||{taxable:0,cgst:0,sgst:0,gross:0,roundOff:0,net:0}};

  } else {

  const title = fnBuildName("Invoice", {invNo:invNo, schoolName:sch?sch.name:(form.schoolName||""), month:form.month, year:form.year, date:form.date, net:(form.net!=null?form.net:(c.grand||0))}).replace(/\.pdf$/i,"") + " Full Pack";

function trackPrint(id){
  if(!id) return;
  const inv = A.invoices.find(i=>i.id===id);
  if(!inv) return;
  sv("iv", A.invoices.map(i=>i.id===id?{...i, printCount:(i.printCount||0)+1, lastPrintedAt:new Date().toISOString()}:i));

}

// ── Smart Duplicate Detection (spec items 4 & 5) ──────────
// hard  = invoice number already exists (which by construction already
//         embeds the matching financial year) -> RED, blocks Save.
// warn  = 4 or more of 5 critical fields match a recent saved invoice
//         (School, Student Count, Eggs & Fruits Qty, Billing Month,
//         Total Amount) -> ORANGE, Save stays enabled.
function smartDupCheck(candidate){
  const hard = A.invoices.find(i=>i.invNo===candidate.invNo && !["cancelled","released","hard_reset"].includes(i.status));
  if(hard) return {level:"red", hard};
  const pool = A.invoices.filter(i=>i.status!=="cancelled").slice(0,30);
  let best=null, bestFields=[];
  pool.forEach(inv=>{
    const studentTotal=(inv.s15||0)+(inv.s68||0);
    const fields=[
      ["School Name", inv.schoolName===candidate.schoolName],
      ["Student Count", studentTotal===candidate.studentTotal],
      ["Eggs & Fruits Quantity", d2(inv.sFr||0)===d2(candidate.eggQty||0)],
      ["Billing Month", inv.month===candidate.month && inv.year===candidate.year],
      ["Total Amount", Math.abs((inv.net||0)-candidate.net)<0.01],
    ];
    const matched=fields.filter(f=>f[1]).map(f=>f[0]);
    if(matched.length>bestFields.length){ bestFields=matched; best=inv; }
  });
  if(best && bestFields.length>=4) return {level:"orange", match:best, fields:bestFields};
  return {level:"blue"};
}

function niStudentCountDisplay(s15,s68){
  const total=s15+s68;
  if(s15>0&&s68>0) return `${total.toLocaleString("en-IN")} <span style="font-weight:600;color:var(--txl);font-size:11.5px">(Class 1-5: ${s15} | Class 6-8: ${s68})</span>`;
  if(s15>0) return `${s15.toLocaleString("en-IN")} <span style="font-weight:600;color:var(--txl);font-size:11.5px">(Class 1-5)</span>`;
  if(s68>0) return `${s68.toLocaleString("en-IN")} <span style="font-weight:600;color:var(--txl);font-size:11.5px">(Class 6-8)</span>`;
  return "0";
}
function niFYLabel(){
  const fy=(A.series||{}).fy||"";
  if(/^\d{4}$/.test(fy)) return "20"+fy.slice(0,2)+"-"+fy.slice(2,4);
  return NI.year||"";
}

// ══════════════════════════════════════════════════════════
// DRIVE — Google Drive folder-structured storage adapter
// ══════════════════════════════════════════════════════════
// This is a STORAGE ADAPTER, not a business-logic function. Every
// read/write to "the cloud" in this app goes through DRIVE.* below.
// Today DRIVE_ADAPTER is backed by localStorage (namespaced to look
// exactly like Drive file paths), because real Google OAuth needs a
// live Client ID (see CLOUD.CLIENT_ID placeholder above) which this
// demo build does not have. When a real Client ID + Drive API is
// wired up, only the 4 methods on DRIVE_ADAPTER need to become real
// gapi.client.drive.files.* calls — everything else (folder layout,
// change-detection, invoice-per-file storage, backup history,
// metadata, restore) stays identical. This is what makes the same
// structure reusable by a future Android app.
const DRIVE_ROOT = "MS ENTERPRISES ERP";

const DRIVE_ADAPTER = {
  writeFile(path, obj){
    try{ localStorage.setItem("gdrive::"+path, JSON.stringify(obj)); return true; }catch(e){ return false; }
  },
  readFile(path){
    try{ const v = localStorage.getItem("gdrive::"+path); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  deleteFile(path){
    try{ localStorage.removeItem("gdrive::"+path); return true; }catch(e){ return false; }
  },
  listFiles(folderPrefix){
    const out = [];
    const p = "gdrive::"+folderPrefix;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(p)===0) out.push(k.slice(8)); // strip "gdrive::" prefix
    }
    return out.sort();
  },
};

// Small stable hash used purely for change-detection (skip re-upload
// of a module when nothing actually changed).
function _driveHash(obj){
  const s = JSON.stringify(obj);
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; }
  return String(h);
}

const DRIVE = {
  paths: {
    company:  DRIVE_ROOT+"/Company/Company.json",
    schools:  DRIVE_ROOT+"/Schools/Schools.json",
    items:    DRIVE_ROOT+"/Items/Items.json",
    invLog:   DRIVE_ROOT+"/Invoice Logs/InvoiceLog.json",
    settings: DRIVE_ROOT+"/Settings/Settings.json",
    alloc:    DRIVE_ROOT+"/MDM/Allocation.json",
    lpg:      DRIVE_ROOT+"/MDM/LPG.json",
    roster:   DRIVE_ROOT+"/MDM/Roster.json",
    metadata: DRIVE_ROOT+"/System/Metadata.json",
    version:  DRIVE_ROOT+"/System/Version.json",
  },
  moduleLabels: {
    company:"Company", schools:"Schools", items:"Items", invLog:"Invoice Logs",
    settings:"Settings", alloc:"MDM · Allocation", lpg:"MDM · LPG", roster:"MDM · Roster",
  },

  invoicePath(inv){
    const d = inv.date ? new Date(inv.date) : new Date();
    const yr = String(d.getFullYear());
    const mo = String(d.getMonth()+1).padStart(2,"0");
    return `${DRIVE_ROOT}/Invoices/${yr}/${mo}/${inv.invNo}.json`;
  },
  backupPath(ts){
    const stamp = ts.slice(0,16).replace("T","_").replace(":","-");
    return `${DRIVE_ROOT}/Backup History/Backup_${stamp}.json`;
  },

  // ── Change-tracked module sync — only writes if content changed ──
  _hashKey(mod){ return "gdrive_hash_"+mod; },
  _touchedKey(mod){ return "gdrive_touched_"+mod; },
  lastSynced(mod){ return localStorage.getItem(this._touchedKey(mod)); },
  syncModule(mod, data){
    if(!CLOUD.user) return false; // must be signed in to sync
    const path = this.paths[mod];
    if(!path) return false;
    const h = _driveHash(data);
    const prevH = localStorage.getItem(this._hashKey(mod));
    if(h === prevH) return false; // unchanged — skip re-upload (smart sync)
    DRIVE_ADAPTER.writeFile(path, data);
    localStorage.setItem(this._hashKey(mod), h);
    localStorage.setItem(this._touchedKey(mod), new Date().toISOString());
    this.touchMetadata();
    if(typeof CLOUD.setSyncStatus==="function") CLOUD.setSyncStatus("Synced ✓","var(--gn)");
    return true;
  },

  // ── One JSON file per invoice under Invoices/YYYY/MM/, plus an
  //    append-only Invoice Logs entry. Called for every invoice
  //    array change (create, cancel, revise) — only the invoices
  //    that actually changed get (re)written. ──
  syncInvoices(invoices){
    if(!CLOUD.user) return false;
    const hashMap = JSON.parse(localStorage.getItem("gdrive_inv_hashes")||"{}");
    let logAppended = false;
    let log = DRIVE_ADAPTER.readFile(this.paths.invLog) || {entries:[]};
    (invoices||[]).forEach(inv=>{
      if(!inv || !inv.invNo) return;
      const h = _driveHash(inv);
      if(hashMap[inv.invNo] === h) return; // unchanged — skip
      const isNew = !(inv.invNo in hashMap);
      DRIVE_ADAPTER.writeFile(this.invoicePath(inv), inv);
      hashMap[inv.invNo] = h;
      log.entries.push({
        invNo: inv.invNo, school: inv.schoolName||"", date: inv.date||"",
        net: inv.net||0, action: isNew?"created":(inv.cancelled?"cancelled":"updated"),
        savedAt: new Date().toISOString(), path: this.invoicePath(inv),
      });
      logAppended = true;
    });
    localStorage.setItem("gdrive_inv_hashes", JSON.stringify(hashMap));
    if(logAppended){
      DRIVE_ADAPTER.writeFile(this.paths.invLog, log);
      localStorage.setItem(this._touchedKey("invLog"), new Date().toISOString());
      localStorage.setItem(this._touchedKey("invoices"), new Date().toISOString());
      this.touchMetadata();
      if(typeof CLOUD.setSyncStatus==="function") CLOUD.setSyncStatus("Synced ✓","var(--gn)");
    }
    return logAppended;
  },
  getInvoiceLog(){ return DRIVE_ADAPTER.readFile(this.paths.invLog) || {entries:[]}; },
  invoiceFileCount(){ try{ return Object.keys(JSON.parse(localStorage.getItem("gdrive_inv_hashes")||"{}")).length; }catch(e){ return 0; } },

  // ── Full timestamped snapshot into Backup History ──
  createBackupSnapshot(){
    const ts = new Date().toISOString();
    const payload = CLOUD.getPayload();
    const path = this.backupPath(ts);
    DRIVE_ADAPTER.writeFile(path, payload);
    this.touchMetadata();
    return path;
  },
  listBackups(){
    return DRIVE_ADAPTER.listFiles(DRIVE_ROOT+"/Backup History/").sort().reverse();
  },

  // ── Metadata.json ──
  touchMetadata(){
    const meta = {
      applicationVersion: "2.5",
      backupVersion: "1.0",
      lastSyncTime: new Date().toISOString(),
      lastBackupTime: CLOUD.lastBackup || null,
      googleAccountEmail: (CLOUD.user && CLOUD.user.email) || null,
      totalInvoices: A.invoices.length,
      totalSchools: A.schools.length,
      totalItems: A.items.length,
      databaseVersion: "1",
    };
    DRIVE_ADAPTER.writeFile(this.paths.metadata, meta);
    DRIVE_ADAPTER.writeFile(this.paths.version, {applicationVersion: meta.applicationVersion, backupVersion: meta.backupVersion});
    return meta;
  },
  getMetadata(){ return DRIVE_ADAPTER.readFile(this.paths.metadata); },

  // ── Populate the whole folder structure immediately on first sign-in ──
  syncAll(){
    if(!CLOUD.user) return;
    this.syncModule("company", A.firm);
    this.syncModule("schools", A.schools);
    this.syncModule("items", A.items);
    this.syncModule("settings", {sett:A.sett||ST0, series:A.series, rates:A.rates, heads:A.heads});
    this.syncModule("alloc", A.alm||[]);
    this.syncModule("lpg", A.lpg||{});
    this.syncModule("roster", A.ro||[]);
    this.syncInvoices(A.invoices||[]);
    this.touchMetadata();
  },

  // ── Restore: selective (one module) ──
  restoreModule(mod, data){
    if(data===null || data===undefined) return false;
    if(mod==="company")  sv("f", data);
    if(mod==="schools")  sv("sc", data);
    if(mod==="items")    sv("it", data);
    if(mod==="settings"){ if(data.sett)sv("st",data.sett); if(data.series)sv("sr",data.series); if(data.rates)sv("rt",data.rates); if(data.heads)sv("hd",data.heads); }
    if(mod==="alloc")    sv("alm", data);
    if(mod==="lpg")      sv("lpg", data);
    if(mod==="roster")   sv("ro", data);
    if(mod==="invLog")   return true; // log is informational only, nothing to restore into A
    return true;
  },
  restoreModuleFromDrive(mod){
    const path = this.paths[mod];
    if(!path) return false;
    const data = DRIVE_ADAPTER.readFile(path);
    if(data===null){ toast("No saved "+(this.moduleLabels[mod]||mod)+" backup found in Drive yet","err"); return false; }
    return this.restoreModule(mod, data);
  },

  // ── Restore: full (from a Backup History snapshot) ──
  restoreFullFromBackup(path){
    const data = DRIVE_ADAPTER.readFile(path);
    if(!data || !data.firm) return false;
    sv("f", data.firm); sv("sr", data.series); sv("rt", data.rates); sv("hd", data.heads);
    sv("it", data.items); sv("sc", data.schools); sv("iv", data.invoices);
    if(data.invoiceUndoArchive) sv("iu", data.invoiceUndoArchive);
    if(data.users) sv("us", data.users);
    if(data.sett) sv("st", data.sett);
    if(data.ro)   sv("ro", data.ro);
    if(data.lpg)  sv("lpg", data.lpg);
    if(data.alm)  sv("alm", data.alm);
    return true;
  },
};

// ── Patch sv() so every existing save call-site automatically syncs
//    to the correct Drive folder. This is purely additive: A[k]=v and
//    localStorage.setItem behavior is 100% unchanged — nothing about
//    existing business logic is touched. ──
const SV_MODULE_MAP = { f:"company", sc:"schools", it:"items" };
const SV_SETTINGS_KEYS = ["st","sr","rt","hd"];
const SV_MDM_MAP = { alm:"alloc", lpg:"lpg", ro:"roster" };
sv = (function(origSv){
  return function(k, v){
    origSv(k, v);
    try{
      if(!CLOUD || !CLOUD.user) return; // only sync when signed in
      if(SV_MODULE_MAP[k]) DRIVE.syncModule(SV_MODULE_MAP[k], v);
      else if(SV_SETTINGS_KEYS.indexOf(k) !== -1) DRIVE.syncModule("settings", {sett:A.sett||ST0, series:A.series, rates:A.rates, heads:A.heads});
      else if(SV_MDM_MAP[k]) DRIVE.syncModule(SV_MDM_MAP[k], v);
      else if(k==="ar") DRIVE_ADAPTER.writeFile(DRIVE_ROOT+"/Security/Admin_Recovery.json",{type:"MDM_ADMIN_RECOVERY",version:1,updatedAt:new Date().toISOString(),records:v||[]});
      else if(k==="iv") DRIVE.syncInvoices(v);
    }catch(e){ /* never let Drive sync errors break the app */ }
  };
})(sv);

/* Master Refresh = manual top-level recovery command for Backup & Sync.
   It does NOT replace Backup Now. It re-seeds the current complete state,
   drains every pending queue item in batches, then performs a full cloud
   backup so Drive status can be re-confirmed in one operation. */
window.cloudMasterRefresh = async function(){
  const btn=document.getElementById('master-refresh-btn');
  if(btn?.dataset.busy==='1') return;
  if(!CLOUD.user){
    toast('Sign in to Google first','err');
    return;
  }
  if(!isGoogleUser(CLOUD.user)){
    toast('Google authentication is required for Master Refresh','err');
    return;
  }

  try{
    if(btn){
      btn.dataset.busy='1';
      btn.disabled=true;
      btn.innerHTML=driveIcon('refresh')+' <span>Refreshing…</span>';
      btn.classList.add('is-busy');
    }
    CLOUD.setSyncStatus('Refreshing…','var(--am)');

    // Make sure the currently stored state for every supported module is
    // represented in the durable queue, even if the user never edited it.
    await V42.enqueueCurrentState();

    // Refresh the credential before any Master API request.
    if(!V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,60)){
      const refreshed=await V42.refreshGoogleCredential();
      if(!refreshed){
        const interactive=await V42.ensureBackendAuthInteractive();
        if(!interactive) throw new Error('Google authentication is required for Master Refresh');
      }
    }

    // Drain the queue in batches. flushQueue intentionally limits each pass
    // to 25 records; this loop makes the manual refresh a true "all modules"
    // command instead of stopping after the first batch.
    let totalSent=0;
    let safety=0;
    while(safety++<40){
      const before=await V42.queueCount();
      if(!before) break;
      const r=await V42.flushQueue();
      totalSent+=r.sent||0;
      const after=await V42.queueCount();
      if(r.authExpired) throw new Error('Google authentication expired during refresh');
      if(r.failed && after>=before) break;
      if(after===0) break;
      if((r.sent||0)===0) break;
    }

    const pending=await V42.queueCount();
    if(pending){
      CLOUD.setSyncStatus('Refresh incomplete · '+pending+' pending','var(--am)');
      if(A.page==='backupsync') gP('backupsync');
      toast('Refresh stopped with '+pending+' pending sync item(s). They remain queued for retry.','info');
      return;
    }

    // Re-run the complete cloud backup after all module sync records are
    // acknowledged. This gives the user an actual Drive write, not a cosmetic
    // green status.
    const result=await V42.backend('backup',{snapshot:CLOUD.getPayload(),appVersion:V42.version});
    if(!result || !result.ok) throw new Error((result&&result.error)||'Master refresh backup was not acknowledged');

    CLOUD.lastBackup=new Date().toISOString();
    localStorage.setItem('cloud_last_backup',CLOUD.lastBackup);
    localStorage.setItem('cloud_last_sync',CLOUD.lastBackup);
    CLOUD.setSyncStatus('Synced ✓','var(--gn)');
    CLOUD.updateUI();
    if(A.page==='backupsync') gP('backupsync');
    auditLog('EXPORT','backup','cloud','Master Refresh completed: '+result.fileName+' | '+totalSent+' queued record(s) synced',null);
    toast('Master Refresh complete — all pending data synced and Drive backup confirmed','ok');
  }catch(e){
    CLOUD.setSyncStatus('Refresh failed','var(--rd)');
    toast('Master Refresh failed: '+(e&&e.message?e.message:e),'err');
    console.error('[MDM] Master Refresh failure',e);
  }finally{
    if(btn){
      btn.dataset.busy='0';
      btn.disabled=false;
      btn.classList.remove('is-busy');
      btn.innerHTML=driveIcon('refresh')+' <span>Refresh</span>';
    }
  }
};

function cloudBackupNow() {
  if(!CLOUD.user) { toast("Sign in to Google first","err"); return; }
  CLOUD.setSyncStatus("Syncing…", "var(--am)");
  const payload = JSON.stringify(CLOUD.getPayload());
  const kb = (payload.length / 1024).toFixed(1);
  setTimeout(() => {
    DRIVE.syncAll(); // make sure every module file is current
    const path = DRIVE.createBackupSnapshot(); // timestamped snapshot in Backup History/
    CLOUD.lastBackup = new Date().toISOString();
    localStorage.setItem("cloud_last_backup", CLOUD.lastBackup);
    CLOUD.setSyncStatus("Synced ✓", "var(--gn)");
    CLOUD.updateUI();
    if(A.page==="backupsync") gP("backupsync"); // refresh backup history list if visible
    auditLog("EXPORT","backup","cloud","Cloud backup: "+kb+"KB | "+A.invoices.length+" invoices | "+A.schools.length+" schools | "+path, null);
    toast("Backup complete — " + kb + " KB saved to Backup History","ok");
  }, 1200);
}

function cloudRestoreBackup() {
  if(!CLOUD.user) { toast("Sign in to Google first","err"); return; }
  if(A.page==="backupsync"){ toast("Pick a snapshot from Backup History below, or a module from Selective Restore","info"); return; }
  toast("Open Backup & Sync to restore from a specific snapshot, or import a local file below","info");
  setTimeout(() => doImp(), 1000);
}

// ── Instant preview when toggling settings ────────────────
function previewSettingChange(type, val) {
  // FIX (surgical): this used to update A.sett in-memory only, without
  // persisting via sv() — Dashboard's dashToggle() and Invoice Control's
  // ctrlToggle() both save this exact same setting instantly, so this
  // screen was the only one where the toggle silently reverted on the
  // next reload unless "Save All Settings" was also clicked. The toast
  // wording gave no indication of that difference. Now persists the
  // same way as the other two entry points for this setting.
  if(!A.sett) A.sett = {...ST0};
  if(type === "hsn")      A.sett.hsnVisible = val;

  sv("st", A.sett);

  const labels = {
    hsn:      val ? "HSN values will show on invoices" : "HSN values hidden (column stays)",
    roundoff: val ? "Round off applied to invoices"    : "Exact values shown on invoices",
  };
  toast(labels[type] || "Setting updated","ok");
}

function driveLocalAvailable(mod){

}
function driveModulePayload(mod){
  return {company:A.firm,schools:A.schools,items:A.items,invoices:A.invoices,invLog:A.invoices,settings:{sett:A.sett||ST0,series:A.series,rates:A.rates,heads:A.heads},alloc:A.alm||[],lpg:A.lpg||{},roster:A.ro||{}}[mod];

async function driveSyncOne(mod){
  if(!CLOUD.user){toast('Connect Google first','err');return;}
  const keyMap={company:'f',schools:'sc',items:'it',invoices:'iv',invLog:'iv',settings:'st',alloc:'alm',lpg:'lpg',roster:'ro'};
  const key=keyMap[mod];
  if(!key){toast('System status is updated by Backup Now','info');return;}
  try{
    const value=driveModulePayload(mod);
    await V42.enqueue('state',key,{key,value});
    const r=await V42.flushQueue();
    if(r.authExpired) throw new Error('Google authentication expired; re-authentication is required');
    if(r.failed) throw new Error((r.failures&&r.failures[0]&&r.failures[0].error)||'Master API did not acknowledge this module');
    if(r.sent<1) throw new Error('No cloud operation was acknowledged');
    toast((DRIVE.moduleLabels[mod]||mod)+' synced to Google Drive ✓','ok');
    if(A.page==='backupsync')gP('backupsync');
  }catch(e){
    toast((DRIVE.moduleLabels[mod]||mod)+' sync failed: '+(e&&e.message?e.message:e),'err');
    if(A.page==='backupsync')gP('backupsync');
  }
}

function driveCloudState(mod){
  if(mod==='backup') return CLOUD.lastBackup?{ok:true,time:CLOUD.lastBackup,source:'Master Drive backup confirmed'}:{ok:false,time:null,source:'No Master Drive backup confirmed'};
  if(mod==='system'){
    const t=localStorage.getItem('cloud_confirmed_at_system')||null;
    return {ok:!!t,time:t,source:t?'Master API confirmed':'No cloud confirmation recorded'};
  }
  const keyMap={company:'f',schools:'sc',items:'it',invoices:'iv',invLog:'iv',settings:'st',alloc:'alm',lpg:'lpg',roster:'ro'};
  const key=keyMap[mod];
  if(!key) return {ok:false,time:null,source:'No cloud mapping'};
  const value=driveModulePayload(mod);
  const currentHash=typeof _driveHash==='function'?_driveHash(value):JSON.stringify(value);
  const confirmedHash=localStorage.getItem('cloud_confirmed_hash_'+key)||'';
  const t=localStorage.getItem('cloud_confirmed_at_'+key)||null;
  const qPromise=V42.queue();
  return {ok:!!t && confirmedHash===currentHash,time:t,source:(t&&confirmedHash===currentHash)?'Confirmed by Master API':'Not confirmed for current data',pendingPromise:qPromise,key};
}

async function driveRefreshStatus(){
  try{
    if(!CLOUD.user) throw new Error('Connect Google first');
    if(!V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,60)){
      const refreshed=await V42.refreshGoogleCredential();
      if(!refreshed) throw new Error('Google authentication expired; re-authentication is required');
    }
    const added=await V42.enqueueCurrentState();
    const r=await V42.flushQueue();
    if(r.authExpired) throw new Error('Google authentication expired during refresh');
    if(A.page==='backupsync')gP('backupsync');
    if(r.failed) toast(`Refresh checked ${r.sent||0} module(s) · ${r.failed} failed · ${r.pending||0} pending`,'err');
    else toast(r.sent ? `Refresh complete · ${r.sent} module(s) confirmed in Drive` : 'Refresh complete · no unconfirmed changes found','ok');
  }catch(e){toast('Refresh failed: '+(e&&e.message?e.message:e),'err');}
}
async function driveRetryAll(){
  try{
    if(!CLOUD.user) throw new Error('Connect Google first');
    const added=await V42.enqueueCurrentState();
    const r=await V42.flushQueue();
    if(r.authExpired) throw new Error('Google authentication expired during retry');
    if(A.page==='backupsync')gP('backupsync');

}

function extRefExcelSerialDate(v){
  if(typeof v==="number" && Number.isFinite(v)){
    // Excel 1900 date system. Keep actual invoice/billing dates intact.
    const utc=Math.round((v-25569)*86400*1000);

  }
  return null;
}

function extRefImport(input){
  const file=input?.files?.[0];
  if(!file)return;
  const name=String(file.name||"").toLowerCase();
  const isExcel=/\.(xlsx|xls)$/.test(name);
  const isJson=/\.json$/.test(name);
  const reader=new FileReader();

  reader.onload=e=>{
    try{
      let rows=[];
      if(isExcel){
        if(typeof XLSX==="undefined"){
          throw new Error("XLSX parser unavailable");
        }
        const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        if(!ws)throw new Error("No worksheet found");
        rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true,cellDates:true});
      }else{
        const text=String(e.target.result||"");
        if(isJson){
          const v=JSON.parse(text);
          rows=Array.isArray(v)?v:(v.records||[]);
        }else{
          const lines=text.split(/\r?\n/).filter(Boolean);
          const head=(lines.shift()||"").split(",").map(x=>x.trim().replace(/^"|"$/g,""));
          rows=lines.map(line=>{
            const vals=line.match(/(".*?"|[^",]+)(?=,|$)/g)||[];
            const o={};
            head.forEach((h,i)=>o[h]=String(vals[i]||"").replace(/^"|"$/g,""));
            return o;
          });
        }
      }

      const normalizeKey=k=>String(k||"")
        .trim().toLowerCase()
        .replace(/[\s_-]+/g,"")
        .replace(/[().]/g,"");

      const normalizeRow=r=>{
        const o={};
        const normalizeKey=k=>String(k||"")
          .trim().toLowerCase()
          .replace(/[\s_\-\/]+/g,"")
          .replace(/[().]/g,"");

        const canonical={
          invoiceNo:/^(invoiceno|invoicenumber|invoice)$/,
          financialYear:/^(financialyear|fy|finyear)$/,
          schoolName:/^(schoolname|school|schooltitle)$/,
          billingMonth:/^(billingmonth|billmonth|month)$/,
          invoiceDate:/^(invoicedate|date|billdate)$/,
          eggFruit:/^(eggfruits?|fruits?|fruit|eggfruitsprovided)$/,
          studentCount:/^(studentcount|numberofstudents|students|student)$/,
          amount:/^(netpayable|amount|totalamount|invoiceamount|netamount)$/,
          fullName:/^(fullname|schoolfullname)$/,
          udiseCode:/^(udisecode|udise)$/,
          referenceNo:/^(referenceno|reference|refno)$/,
          status:/^(status|invoicestatus)$/
        };

        const keys=Object.keys(r||{});
        const normalized=keys.map(k=>normalizeKey(k));
        const recognizedIndexes=[];
        const used=new Set();

        keys.forEach((k,i)=>{
          const nk=normalized[i];
          for(const [field,rx] of Object.entries(canonical)){
            if(rx.test(nk)){
              o[field]=r[k];
              used.add(i);
              recognizedIndexes.push(i);
              break;
            }
          }
        });

        // Future-proof exactly the next three physical columns after the last
        // recognized source column. Their values are stored only as future1/2/3.
        // No other/unrelated Excel columns enter the ERP record.
        const lastRecognized=recognizedIndexes.length?Math.max(...recognizedIndexes):-1;
        let futureSlot=1;
        for(let i=lastRecognized+1;i<keys.length && futureSlot<=3;i++){
          if(used.has(i))continue;
          const v=r[keys[i]];
          o["future"+futureSlot]=v;
          futureSlot++;
        }

        if(!o.school && o.schoolName)o.school=o.schoolName;
        o.billingMonth=extRefCanonicalDate(o.billingMonth);
        o.invoiceDate=extRefCanonicalDate(o.invoiceDate);
        return extRefRepairRecordV5(o);
      };

      rows=rows.map(normalizeRow).filter(r=>String(r.invoiceNo||"").trim());

      const st=extRefState();
      const existing=new Set(st.records.map(r=>String(r.invoiceNo||"").trim()));
      let added=0, skipped=0;

      rows.forEach(r=>{
        const no=String(r.invoiceNo||"").trim();
        if(!no||existing.has(no)){skipped++;return}
        st.records.push(r);
        existing.add(no);
        added++;
      });

      extRefSaveState(st);
      extRefRefresh();
      toast(`${added} external record(s) imported${skipped?`; ${skipped} duplicate/blank skipped`:""}`,"ok");
    }catch(err){
      console.error("External Invoice Register import:",err);
      toast(isExcel
        ? "Excel import failed. Please check the first sheet and column headings."
        : "Import failed: invalid file format","err");
    }finally{
      input.value="";
    }
  };

  if(isExcel){
    reader.readAsArrayBuffer(file);
  }else{
    reader.readAsText(file);
  }
}

function extRefIsPlaceholder(v){const s=String(v??"").trim().toLowerCase();return !s||s==="—"||s==="-"||s==="null"||s==="undefined"||s==="nan";}

function extRefMonthV5(v){const c=extRefCanonicalDate(v);if(!c)return "";const m=c.match(/^(\d{4})-(\d{2})-/);if(!m)return "";const y=+m[1],mo=+m[2];if(y<2000||y>2100||mo<1||mo>12)return "";return new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,mo-1,1)));}

function extRefNormalizeDateValue(v){
  if(v instanceof Date && !Number.isNaN(v.getTime()))return v.toISOString();
  if(typeof v==="number"){
    const d=extRefExcelSerialDate(v);
    return d?d.toISOString():String(v);
  }
  const s=String(v??"").trim();
  if(!s)return "";
  // Excel serial sometimes arrives as a numeric string.
  if(/^\d{4,6}(?:\.\d+)?$/.test(s)){
    const n=Number(s),d=extRefExcelSerialDate(n);
    if(d && d.getFullYear()>=2000 && d.getFullYear()<=2100)return d.toISOString();
  }
  // yyyy-mm-dd / dd-mm-yyyy / mm/dd/yyyy remain parseable.
  return s;
}

function extRefPick(r,aliases){

    if(k!=null && r[k]!=="" && r[k]!=null)return r[k];
  }
  return "";
}

  const expectedWhole=(students!=null)?Math.round(students)*EXT_REF_CLASS15_RATE:null;
  const calculatedDiff=(actual!=null&&expectedWhole!=null)?actual-expectedWhole:null;
  const sourceResidual=extRefNum(r.residualVsWholeStudent);
  const diff=sourceResidual!=null?sourceResidual:calculatedDiff;
  const expectedEffective=(students!=null)?students*EXT_REF_CLASS15_RATE:null;
  return {actual,students,derived:false,expected:expectedEffective,expectedWhole,diff,whole:students!=null?Math.round(students):null,impliedDelta:students!=null?students-Math.round(students):null,adjustment:diff!=null?Math.abs(diff):null};
}

function extRefReconClass(r){
  const x=extRefRecon(r);
  if(x.diff==null)return "";
  if(Math.abs(x.diff)<0.01)return "ext-recon-good";
  if(Math.abs(x.diff)<=5)return "ext-recon-warn";
  return "ext-recon-bad";
}

function extRefReconSummary(rows){
  let amount=0,derived=0,adjusted=0;
  rows.forEach(r=>{
    const x=extRefRecon(r);
    if(x.actual!=null)amount+=x.actual;
    if(x.derived)derived++;
    if(x.diff!=null&&Math.abs(x.diff)>=0.01)adjusted++;
  });
  return {count:rows.length,amount,derived,adjusted};
}

function extRefReconText(r){
  const x=extRefRecon(r);
  if(x.actual==null)return "Actual amount unavailable";
  if(x.students==null)return "Student count unavailable";
  const s=x.students.toFixed(3).replace(/\.?0+$/,"");
  const d=x.diff==null?null:x.diff;
  if(Math.abs(d||0)<0.01)return `Expected ₹${x.expected.toFixed(2)} · Match`;
  return `${x.derived?"Derived ":""}${s} students @ ₹${EXT_REF_CLASS15_RATE.toFixed(2)} · Expected ₹${x.expected.toFixed(2)} · Difference ${d>=0?"+":"−"}₹${Math.abs(d).toFixed(2)}`;
}

function extRefRecordKey(r){const no=String(r.invoiceNo||"").trim().toLowerCase(),fy=String(r.financialYear||"").trim().toLowerCase(),bm=extRefMonthV5(r.billingMonth).toLowerCase(),sc=String(r.school||r.schoolName||"").trim().toLowerCase(),a=Number(r.amount);return [no,fy,bm,sc,Number.isFinite(a)?a.toFixed(2):""].join("|");}

function extRefRepairAll(){
  const st=extRefState();
  let changed=0;
  st.records=st.records.map(r=>{
    const x={...r};
    if(Object.prototype.hasOwnProperty.call(x,"inferredStudents") ||
       Object.prototype.hasOwnProperty.call(x,"residualVsWholeStudent")){
      delete x.studentCount;
      delete x.effectiveStudentQty;
      delete x.students;
      delete x.numberOfStudents;
      delete x.inferredStudents;
      delete x.residualVsWholeStudent;
    }
    const after=extRefRepairRecord(x);
    if(JSON.stringify(after)!==JSON.stringify(r))changed++;
    return after;
  });
  if(changed)extRefSaveState(st);
  return changed;
}

function extRefRepairLegacyDataset(st){let changed=false;st.records=st.records.map(r=>{const x=extRefRepairRecordV5(r);if(JSON.stringify(x)!==JSON.stringify(r))changed=true;return x;});const have=new Set(st.records.map(extRefRecordKey));EXT_REF_LEGACY_REPAIR.forEach(src=>{const x=extRefRepairRecordV5(src),k=extRefRecordKey(x);if(!have.has(k)){st.records.push(x);have.add(k);changed=true;}});return changed;}

function extRefRepairRecord(r){
  const x={...r};
  x.invoiceNo=String(x.invoiceNo||extRefPick(r,["Invoice No.","Invoice No","Invoice Number","InvoiceNo"])).trim();
  x.financialYear=String(x.financialYear||extRefPick(r,["Financial Year","FY","FY Code"])).trim();
  x.school=String(x.school||x.schoolName||extRefPick(r,["School / Billed To","School/Billed To","School Name","School","Billed To"])).trim();
  x.schoolName=x.school;
  x.billingMonth=extRefNormalizeDateValue(x.billingMonth||extRefPick(r,["Billing Month","Bill Month","Month"]));
  x.invoiceDate=extRefNormalizeDateValue(x.invoiceDate||extRefPick(r,["Invoice Date","InvoiceDate"]));
  x.amount=x.amount??x.netPayable??extRefPick(r,["Net Amount","Net Payable","Amount","Total Amount"]);
  x.totalBeforeTax=x.totalBeforeTax??extRefPick(r,["Total Before Tax"]);
  x.roundOff=x.roundOff??extRefPick(r,["Round Off","RoundOff"]);
  // Student data is source-only. Never infer it from amount.
  delete x.inferredStudents;
  delete x.residualVsWholeStudent;
  x.udiseCode=x.udiseCode??extRefPick(r,["UDISE Code","UDISE"]);
  x.eggFruit=x.eggFruit??extRefPick(r,["Egg / Fruits","Egg/Fruits","Egg / Fruit","Egg/Fruit","Egg Fruits","Egg Fruit","Fruits","Fruit"]);
  x.fullName=x.fullName||x.school;
  return x;
}

function extRefRepairRecordV5(r){
 const x={...r};const invoiceNo=String(x.invoiceNo||extRefPick(r,["Invoice No.","Invoice No","Invoice Number","InvoiceNo"])).trim();
 const rawAmount=Number(String(x.amount??extRefPick(r,["Net Amount","Net Payable","Amount","Total Amount"])).replace(/[,₹\s]/g,""));
 const legacy=EXT_REF_LEGACY_REPAIR.find(z=>String(z.invoiceNo).trim()===invoiceNo&&(extRefIsPlaceholder(x.school)||String(z.school||"").trim().toLowerCase()===String(x.school||x.schoolName||"").trim().toLowerCase())&&(!Number.isFinite(rawAmount)||Number(z.amount)===rawAmount))||EXT_REF_LEGACY_REPAIR.find(z=>String(z.invoiceNo).trim()===invoiceNo);
 const fy=extRefPick(r,["Financial Year","FY","FY Code"]),school=extRefPick(r,["School / Billed To","School/Billed To","School Name","School","Billed To"]),bm=extRefPick(r,["Billing Month","Bill Month","Month"]),invd=extRefPick(r,["Invoice Date","InvoiceDate"]),amt=extRefPick(r,["Net Amount","Net Payable","Amount","Total Amount"]);
 if(!extRefValidYear(x.financialYear))x.financialYear=legacy?.financialYear||fy||"";
 if(extRefIsPlaceholder(x.school))x.school=legacy?.school||school||x.schoolName||""; x.schoolName=x.school;
 if(!extRefMonthV5(x.billingMonth))x.billingMonth=legacy?.billingMonth||bm||"";
 if(!extRefCanonicalDate(x.invoiceDate))x.invoiceDate=legacy?.invoiceDate||invd||"";
 if(extRefIsPlaceholder(x.amount))x.amount=legacy?.amount??amt??"";
 delete x.inferredStudents;
 delete x.residualVsWholeStudent;
 return x;
}

const EXT_REF_STUDENT_SOURCE_MIGRATION="mdm_external_invoice_register_student_source_v1";
function extRefPurgeLegacyCalculatedStudents(st){
  if(LS.get(EXT_REF_STUDENT_SOURCE_MIGRATION,false))return false;
  let changed=false;
  st.records=st.records.map(r=>{
    const x={...r};
    // The current External Register dataset was imported from an Excel source
    // without a Student column. Remove ONLY the old calculated student payload.
    if(Object.prototype.hasOwnProperty.call(x,"studentCount") ||
       Object.prototype.hasOwnProperty.call(x,"effectiveStudentQty") ||
       Object.prototype.hasOwnProperty.call(x,"students") ||
       Object.prototype.hasOwnProperty.call(x,"numberOfStudents") ||
       Object.prototype.hasOwnProperty.call(x,"inferredStudents") ||
       Object.prototype.hasOwnProperty.call(x,"residualVsWholeStudent")){
      delete x.studentCount;
      delete x.effectiveStudentQty;
      delete x.students;
      delete x.numberOfStudents;
      delete x.inferredStudents;
      delete x.residualVsWholeStudent;
      changed=true;
    }
    return x;
  });
  LS.set(EXT_REF_STUDENT_SOURCE_MIGRATION,true);
  return changed;
}
function extRefState(){
  const v=LS.get(EXT_REF_KEY,{records:[]});
  const st=v&&Array.isArray(v.records)?v:{records:[]};
  const changed=extRefRepairLegacyDataset(st);
  const purged=extRefPurgeLegacyCalculatedStudents(st);
  if(changed||purged)LS.set(EXT_REF_KEY,{records:st.records});
  return st;
}

const P916={version:"4.50",completedAt:new Date().toISOString()};
function p916Role(){const r=String(A.currentUser?.role||"").toLowerCase().trim();return r==="administrator"||r.startsWith("admin")?"admin":r;}

// 9 — MDM Engine integrity validation
function p916ValidateInvoice(inv){
  if(!inv) return {ok:false,errors:["Invoice not found"]};
  const errors=[];
  const nums=["taxable","cgst","sgst","net","grand"];
  nums.forEach(k=>{if(inv[k]!==undefined && !Number.isFinite(Number(inv[k]))) errors.push(k+" is not numeric");});
  if(inv.taxable!==undefined && inv.cgst!==undefined && inv.sgst!==undefined){
    const gross=d2(Number(inv.taxable||0)+Number(inv.cgst||0)+Number(inv.sgst||0));
    const expected=d2(gross+Number(inv.roundOff||0));
    if(Math.abs(expected-Number(inv.net||0))>0.02 && inv.net!==undefined) errors.push("Net payable does not reconcile with taxable + GST + round-off");
  }
  if(inv.invNo && A.invoices.filter(x=>x.invNo===inv.invNo && x.id!==inv.id).length) errors.push("Duplicate invoice number");
  return {ok:errors.length===0,errors};
}
function p916ValidateAllInvoices(){
  const bad=A.invoices.map(p916ValidateInvoice).filter(x=>!x.ok);
  return {total:A.invoices.length,invalid:bad.length,ok:bad.length===0};
}

  add("Drive adapter",typeof DRIVE!=="undefined"&&typeof DRIVE.writeFile==="function","Drive abstraction available");
  add("Invoice integrity",p916ValidateAllInvoices().ok,JSON.stringify(p916ValidateAllInvoices()));
  const failed=tests.filter(t=>!t.ok);
  const report={version:P916.version,runAt:new Date().toISOString(),passed:tests.length-failed.length,failed:failed.length,tests};
  auditLog("TEST","system","phase9-16",failed.length?"Self-test completed with failures":"Self-test passed",report);
  return report;
}

<!-- v4.51 PRODUCTION INFRASTRUCTURE HARDENING — SURGICAL ONLY -->
<script>
/* ================================================================
   v4.51 PRODUCTION INFRASTRUCTURE HARDENING — SURGICAL ONLY
   - Keeps local username/password login as an emergency/offline path.
   - Google login is the only path permitted to write to the master cloud.
   - Cloud ACK is required before an operation is marked synced.
   - Existing invoice/PDF/theme/calculation/rendering logic is untouched.
   ================================================================ */
(function(){
  'use strict';
  const INFRA_VERSION = '4.51';

  function isGoogleUser(u){ return !!(u && u.authMethod === 'google' && u.email); }
  function isLocalUser(u){ return !!(u && (u.authMethod === 'local' || u.authMethod === 'client')); }

  /* ---- Emergency local login: preserve existing credentials and add durable session ---- */
  window.doLogin = async function(){
    try{
      const user=(document.getElementById('lu')||{}).value?.trim()||'';
      const pass=(document.getElementById('lp')||{}).value||'';
      const found=(A.users||[]).find(u=>u.username===user&&u.password===pass);
      if(!found){ toast('Invalid username or password','err'); return; }

      const localUser={...found,authMethod:'local',deviceId:V42.deviceId,signedInAt:new Date().toISOString()};
      A.loggedIn=true;
      A.currentUser=localUser;
      CLOUD.user=null;
      CLOUD.token=null;
      V42.idToken=null;
      try{ await V42.saveSession(localUser); }catch(e){ console.warn('Local session persistence failed',e); }
      try{ localStorage.setItem('mdm_local_user',JSON.stringify(localUser)); localStorage.removeItem('cloud_user'); }catch(e){}
      renderShell();
      gP('dashboard');
      toast('Local emergency login active — cloud sync requires Google sign-in','ok');
    }catch(e){ toast('Local login failed: '+e.message,'err'); }
  };

  /* ---- Google sign-in: backend ACK is mandatory before session becomes cloud-authenticated ---- */
  V42._googleRefreshPromise = null;
  V42.isGoogleTokenUsable = function(token, skewSeconds){
    try{
      if(!token) return false;
      const part=String(token).split('.')[1];
      if(!part) return false;
      const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'=')));
      const skew=Number(skewSeconds||90);
      return !!payload.sub && !!payload.email && (!payload.exp || Number(payload.exp) > Math.floor(Date.now()/1000)+skew);
    }catch(e){ return false; }
  };

  V42.refreshGoogleCredential = async function(){
    if(V42._googleRefreshPromise) return V42._googleRefreshPromise;
    V42._googleRefreshPromise=(async()=>{
      try{
        await V42.loadGIS();
        if(!V42.googleClientId || !isGoogleUser(CLOUD.user)) return false;
        return await new Promise(resolve=>{
          let done=false;
          const finish=v=>{if(done)return;done=true;resolve(!!v);};
          const timeout=setTimeout(()=>finish(false),10000);
          try{
            google.accounts.id.initialize({client_id:V42.googleClientId,callback:async resp=>{
              try{
                if(!resp || !resp.credential) return finish(false);
                await V42.acceptGoogleCredential(resp.credential,{silentRefresh:true});
                clearTimeout(timeout); finish(V42.isGoogleTokenUsable(V42.idToken,60));
              }catch(e){ clearTimeout(timeout); finish(false); }
            }});
            google.accounts.id.prompt(n=>{
              if(n && (n.isNotDisplayed() || n.isSkippedMoment())) { clearTimeout(timeout); finish(false); }
            });
          }catch(e){ clearTimeout(timeout); finish(false); }
        });
      }finally{ V42._googleRefreshPromise=null; }
    })();
    return V42._googleRefreshPromise;
  };

  V42.acceptGoogleCredential = async function(credential, options){
    options=options||{};
    try{
      if(!credential) throw new Error('Google credential was not returned');
      try{ document.getElementById('mdm-google-gis-overlay')?.remove(); }catch(e){}
      const part=String(credential).split('.')[1];
      if(!part) throw new Error('Invalid Google credential');
      const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'=')));
      if(V42.googleClientId && payload.aud && payload.aud!==V42.googleClientId) throw new Error('Google Client ID mismatch');
      if(payload.exp && Number(payload.exp)*1000 < Date.now()) throw new Error('Google credential expired');
      if(!payload.sub || !payload.email) throw new Error('Google credential is missing identity claims');

      const user={id:payload.sub,name:payload.name||payload.email,email:String(payload.email).toLowerCase(),picture:payload.picture||'',googleSub:payload.sub,signedInAt:new Date().toISOString(),deviceId:V42.deviceId,authMethod:'google'};
      const previous={user:CLOUD.user,token:CLOUD.token,idToken:V42.idToken};
      CLOUD.user=user; CLOUD.token=credential; V42.idToken=credential;
      let authResult;
      try{ authResult=await V42.backend('auth',{idToken:credential,user}); }
      catch(e){ CLOUD.user=previous.user||null; CLOUD.token=previous.token||null; V42.idToken=previous.idToken||null; throw e; }
      if(!authResult || !authResult.ok) throw new Error((authResult&&authResult.error)||'Master authentication rejected');

      const prevRole=(A.currentUser&&A.currentUser.role)?A.currentUser.role:'admin';
      const mergedUser={...user,role:prevRole,username:(A.currentUser&&A.currentUser.username)||user.email};
      await V42.saveSession(mergedUser);
      localStorage.setItem('cloud_user',JSON.stringify(mergedUser));
      localStorage.removeItem('mdm_local_user');
      A.loggedIn=true; A.currentUser=mergedUser; CLOUD.ready=true;
      auditLog('LOGIN','cloud','google','Google account authenticated and accepted by master: '+user.email,null);

      // IMPORTANT: sign-in must seed every current module into the durable queue.
      // Previously only modules that had been edited after login were queued, which
      // caused untouched modules to remain "Not synced yet" until the user saved them.
      await V42.enqueueCurrentState();
      const q=await V42.flushQueue();
      if(A.page==='backupsync') gP('backupsync');
      CLOUD.updateUI();
      if(!options.silentRefresh){ toast('Signed in as '+(user.name||user.email)+(q.sent?' — '+q.sent+' record(s) synced':''),'ok'); }
    }catch(e){
      if(!options.silentRefresh) toast('Google sign-in failed: '+e.message,'err');
      console.error('[MDM v4.51] Google authentication failure',e);
      throw e;
    }
  };

  /* ---- Cloud queue: never attempt cloud writes for local-only sessions ---- */
  V42.flushQueue = async function(){
    if(V42.syncing || !navigator.onLine || !V42.apiUrl || !isGoogleUser(CLOUD.user)) return {sent:0,failed:0,skipped:true};
    if(!V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,60)){
      const refreshed=await V42.refreshGoogleCredential();
      if(!refreshed) return {sent:0,failed:1,authExpired:true};
    }
    V42.syncing=true;
    let sent=0,failed=0,authExpired=false;
    const failures=[];
    try{
      const q=(await V42.queue()).filter(x=>x.status!=='synced').slice(0,25);
      for(const op of q){
        op.status='uploading'; op.attempts=(op.attempts||0)+1;
        await V42.idbSet('queue',op.id,op);
        try{
          const result=await V42.backend('sync',{operationId:op.id,type:op.type,key:op.key,payload:op.payload,createdAt:op.createdAt,deviceId:op.deviceId,appVersion:op.appVersion});
          if(!result || !result.ok) throw new Error((result&&result.error)||'Server did not acknowledge sync');

          op.status='synced';
          op.syncedAt=new Date().toISOString();
          op.serverOperationId=result.operationId||op.id;
          op.serverResult=result;
          await V42.idbSet('queue',op.id,op);

          // Cloud state is confirmed ONLY after the Master API ACK. The old
          // local DRIVE adapter is deliberately not used as cloud truth.
          let value=op.payload&&Object.prototype.hasOwnProperty.call(op.payload,'value')?op.payload.value:null;
          if(op.key==='iv'){
            localStorage.setItem('cloud_confirmed_hash_iv',typeof _driveHash==='function'?_driveHash(value):JSON.stringify(value));
            localStorage.setItem('cloud_confirmed_at_iv',op.syncedAt);
            localStorage.setItem('cloud_confirmed_hash_invoices',typeof _driveHash==='function'?_driveHash(value):JSON.stringify(value));
            localStorage.setItem('cloud_confirmed_at_invoices',op.syncedAt);
            localStorage.setItem('cloud_confirmed_at_invLog',op.syncedAt);
          }else if(value!==null){
            const h=typeof _driveHash==='function'?_driveHash(value):JSON.stringify(value);
            localStorage.setItem('cloud_confirmed_hash_'+op.key,h);
            localStorage.setItem('cloud_confirmed_at_'+op.key,op.syncedAt);
          }
          localStorage.setItem('cloud_last_sync',op.syncedAt);
          sent++;
        }catch(e){
          op.status='pending';
          op.lastError=String(e&&e.message?e.message:e);
          await V42.idbSet('queue',op.id,op);
          failed++;
          failures.push({key:op.key,error:op.lastError});
          // A token/auth failure affects every remaining operation; a module
          // failure does not. Continue so one bad module cannot block the rest.
          if(/token|credential|authentication|unauthorized|permission/i.test(op.lastError)){
            authExpired=true;
            break;
          }
        }
      }
      const left=await V42.queueCount();
      if(left===0 && sent) CLOUD.setSyncStatus('Synced ✓','var(--gn)');
      else if(failed && sent) CLOUD.setSyncStatus(left+' pending · '+failed+' failed','var(--am)');
      else if(left) CLOUD.setSyncStatus(left+' pending','var(--am)');
      if(sent && A.page==='backupsync') gP('backupsync');
    }finally{ V42.syncing=false; }
    return {sent,failed,authExpired,failures,pending:await V42.queueCount()};
  };

  /* ---- Interactive GIS re-auth when a persisted cloud session has no live credential ---- */
  V42.ensureBackendAuthInteractive = async function(){
    try{
      await V42.loadGIS();
      if(!V42.googleClientId || !isGoogleUser(CLOUD.user)) return false;
      return await new Promise(resolve=>{
        let done=false;
        const finish=v=>{if(done)return;done=true;try{document.getElementById('mdm-google-gis-overlay')?.remove();}catch(e){};resolve(!!v);};
        google.accounts.id.initialize({client_id:V42.googleClientId,callback:async resp=>{
          try{if(!resp?.credential) return finish(false); await V42.acceptGoogleCredential(resp.credential); finish(!!V42.idToken);}
          catch(e){console.error('[MDM] interactive Google re-auth failed',e);finish(false);}
        }});
        const overlay=document.createElement('div');
        overlay.id='mdm-google-gis-overlay';
        overlay.style.cssText='position:fixed;inset:0;z-index:20000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;';
        overlay.innerHTML='<div style="background:var(--card,#fff);border:1px solid var(--bd,#ddd);border-radius:14px;padding:18px;min-width:280px;max-width:420px;box-shadow:0 16px 50px rgba(0,0,0,.22)"><div style="font-weight:800;font-size:14px;margin-bottom:10px">Continue with Google</div><div id="mdm-google-gis-overlay-button"></div><button type="button" class="btn btn-g btn-sm" style="margin-top:10px;width:100%">Cancel</button></div>';
        document.body.appendChild(overlay);
        overlay.querySelector('button')?.addEventListener('click',()=>finish(false));
        // When the GIS button opens Google's own account popup, the parent window
        // loses focus. Hide only our wrapper at that moment; Google's popup remains.
        const hideOnBlur=()=>{try{overlay.remove();}catch(_){}};
        window.addEventListener('blur',hideOnBlur,{once:true});
        const host=document.getElementById('mdm-google-gis-overlay-button');
        if(host) google.accounts.id.renderButton(host,{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:320});
      });
    }catch(e){console.error('[MDM] GIS re-auth setup failed',e);return false;}
  };

  /* ---- Backup Now: real cloud backup for Google users; local snapshot for emergency login ---- */
  window.cloudBackupNow = async function(){
    try{
      if(isLocalUser(A.currentUser) || !CLOUD.user){
        await V42.createLocalSnapshot();
        CLOUD.setSyncStatus('Local backup saved','var(--am)');
        toast('Local backup created. Sign in with Google to send it to Master Drive.','ok');
        return;
      }
      if(!isGoogleUser(CLOUD.user)) throw new Error('Google authentication is required for Master Drive backup');
      // A persisted Google session may outlive its short-lived ID token. Refresh it
      // before touching Master Drive; only fall back to interactive re-auth if refresh fails.
      if(!V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,60)){
        const ok=await V42.refreshGoogleCredential();
        if(!ok || !V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,30)){
          const interactive=await V42.ensureBackendAuthInteractive();
          if(!interactive || !V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,30)) throw new Error('Google authentication is required for Master Drive backup');
        }
      }
      CLOUD.setSyncStatus('Syncing…','var(--am)');

      // Ensure every current module is represented even when it has never been
      // edited during this session. enqueueCurrentState is hash-aware, so this
      // does not create duplicate records for already-confirmed data.
      await V42.enqueueCurrentState();
      // Drain every module independently. A single module failure remains pending
      // but must not prevent the other modules from reaching Master Drive.
      const q=await V42.flushQueue();
      const pending=await V42.queueCount();

      const result=await V42.backend('backup',{snapshot:CLOUD.getPayload(),appVersion:V42.version});
      if(!result || !result.ok) throw new Error((result&&result.error)||'Master backup was not acknowledged');

      CLOUD.lastBackup=new Date().toISOString();
      localStorage.setItem('cloud_last_backup',CLOUD.lastBackup);
      localStorage.setItem('cloud_confirmed_at_backup',CLOUD.lastBackup);
      localStorage.setItem('cloud_confirmed_at_system',CLOUD.lastBackup);
      localStorage.setItem('cloud_last_sync',CLOUD.lastBackup);

      if(pending>0){
        CLOUD.setSyncStatus('Backup saved · '+pending+' pending','var(--am)');
      }else{
        CLOUD.setSyncStatus('Synced ✓','var(--gn)');
      }
      CLOUD.updateUI();
      if(A.page==='backupsync') gP('backupsync');

        toast('Backup completed — saved to Master Drive. '+pending+' sync item(s) remain pending.','ok');
      }else{
        toast('Backup completed — saved to Master Drive','ok');
      }
    }catch(e){
      CLOUD.setSyncStatus('Cloud backup failed','var(--rd)');
      toast('Backup failed: '+e.message,'err');
      console.error('[MDM v4.51] Backup failure',e);
    }
  };

  /* ---- Cloud sign-in button: always use GIS, never the old email prompt ---- */
  window.cloudSignIn = function(){ return V42.googleSignIn(); };

  /* ---- Cloud sign-out: clear only cloud session; keep local emergency login available ---- */
  window.cloudSignOut = async function(){
    try{
      const was=CLOUD.user?.email||'';
      CLOUD.user=null; CLOUD.ready=false; CLOUD.token=null; V42.idToken=null;
      localStorage.removeItem('cloud_user');
      try{ await V42.clearSession(); }catch(e){}
      auditLog('LOGIN','cloud','google','Google account disconnected: '+was,null);
      CLOUD.updateUI();
      toast('Google account disconnected — local login remains available','ok');
    }catch(e){ toast('Sign-out failed: '+e.message,'err'); }
  };

  /* ---- Add a Google button to the existing login page without changing its layout ---- */
  function installGoogleLoginButton(){
    try{
      const card=document.getElementById('lu')?.closest('.card');
      if(!card || document.getElementById('mdm-google-login-btn')) return;
      const localBtn=document.querySelector('button[onclick="doLogin()"]');
      if(!localBtn) return;
      const wrap=document.createElement('div');
      wrap.id='mdm-google-login-wrap';
      wrap.style.cssText='margin-top:9px';
      wrap.innerHTML='<div id="mdm-google-gis-button" style="min-height:40px;display:flex;justify-content:center"></div><div style="margin-top:7px;text-align:center;font-size:10.5px;color:var(--txl)">Google = cloud account &nbsp;•&nbsp; Username/password = emergency offline login</div>';
      localBtn.parentNode.insertBefore(wrap,localBtn.nextSibling);
      (async()=>{try{await V42.loadGIS();google.accounts.id.initialize({client_id:V42.googleClientId,callback:async resp=>{if(resp&&resp.credential) await V42.acceptGoogleCredential(resp.credential);}});const host=document.getElementById('mdm-google-gis-button');if(host)google.accounts.id.renderButton(host,{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:host.clientWidth||360});}catch(e){console.warn('[MDM v4.51] GIS button unavailable',e);}})();
    }catch(e){ console.warn('[MDM v4.51] Google login button skipped',e); }
  }

  /* ---- Prevent a stale local session from being presented as a cloud identity ---- */
  async function normalizeStartupSession(){
    try{
      const sess=await V42.getSession();
      if(sess && sess.user && isLocalUser(sess.user)){
        A.loggedIn=true; A.currentUser=sess.user;
        CLOUD.user=null; CLOUD.ready=false; CLOUD.token=null; V42.idToken=null;
        localStorage.removeItem('cloud_user');
      }
    }catch(e){}
    installGoogleLoginButton();
  }

  setTimeout(normalizeStartupSession,150);
  setTimeout(installGoogleLoginButton,700);

  /* ---- Hard safety diagnostics exposed for the Phase 16 self-test ---- */
  window.mdmInfrastructureSelfTest = async function(){
    const out=[];
    const add=(name,ok,detail)=>out.push({name,ok:!!ok,detail:detail||''});
    add('IndexedDB',!!window.indexedDB,'Browser storage available');
    add('Local login',typeof window.doLogin==='function','Emergency username/password path retained');
    add('Google GIS loader',typeof V42.loadGIS==='function','Google Identity Services hook available');
    add('Master backend bridge',typeof V42.backend==='function','Apps Script/API bridge available');
    add('Durable queue',typeof V42.flushQueue==='function','Server ACK required before synced');
    add('Cloud backup',typeof window.cloudBackupNow==='function','Google backup + local fallback');
    add('Invoice renderer',typeof window.renderInvoicePDF==='function' || typeof window.prepareInvoicePDF==='function','Existing renderer left intact');
    return out;
  };
})();

<script id="ni-preview-zoom-script">
(function(){
  const Z={scale:1,pointers:new Map(),startDist:0,startScale:1,lastTap:0,lastX:0,lastY:0,touchTap:0};
  let queued=false;

  function vp(){return document.querySelector(".ni-preview-viewport");}
  function doc(){const v=vp();return v&&v.querySelector(".ni-preview-document");}

  function setZoom(value){
    const v=vp(),d=doc();
    if(!v||!d)return;
    Z.scale=Math.max(1,Math.min(3,value));
    d.style.setProperty("--ni-preview-zoom",Z.scale);
    v.classList.toggle("ni-is-zoomed",Z.scale>1.001);
    const label=v.querySelector(".ni-zoom-level");
    if(label)label.textContent=Math.round(Z.scale*100)+"%";
    if(Z.scale<=1.001){v.scrollLeft=0;v.scrollTop=0;}
  }

  function ensureStage(v){
    const d=doc();
    if(!v||!d)return;
    const p=d.parentElement;
    if(p&&p.classList.contains("ni-preview-zoom-stage"))return;
    const stage=document.createElement("div");
    stage.className="ni-preview-zoom-stage";
    d.parentNode.insertBefore(stage,d);
    stage.appendChild(d);
  }

  function controls(v){
    let c=v.querySelector(".ni-preview-zoom-controls");
    if(c)return;
    c=document.createElement("div");
    c.className="ni-preview-zoom-controls";
    c.innerHTML='<button type="button" aria-label="Zoom out" data-z="-">−</button><span class="ni-zoom-level">100%</span><button type="button" aria-label="Reset zoom" data-z="reset">100%</button><button type="button" aria-label="Zoom in" data-z="+">+</button>';
    c.addEventListener("click",function(e){
      const b=e.target.closest("button");
      if(!b)return;
      if(b.dataset.z==="+")setZoom(Z.scale+.25);
      else if(b.dataset.z==="-")setZoom(Z.scale-.25);
      else setZoom(1);
    });
    v.insertBefore(c,v.firstChild);
  }

  function bind(v){
    if(!v||v.dataset.zoomBound==="4")return;
    v.dataset.zoomBound="4";
    v.classList.add("ni-preview-zoom-enabled");
    ensureStage(v);
    controls(v);

    v.addEventListener("pointerdown",function(e){
      if(e.pointerType==="mouse"&&e.button!==0)return;
      Z.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(Z.pointers.size===2){
        const a=[...Z.pointers.values()];
        Z.startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        Z.startScale=Z.scale;
      }
    },{passive:true});

    v.addEventListener("pointermove",function(e){
      if(!Z.pointers.has(e.pointerId))return;
      Z.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(Z.pointers.size===2&&Z.startDist>0){
        const a=[...Z.pointers.values()];
        const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        if(d>0)setZoom(Z.startScale*(d/Z.startDist));
      }
    },{passive:true});

    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
      v.addEventListener(ev,function(e){
        Z.pointers.delete(e.pointerId);
        if(Z.pointers.size<2)Z.startDist=0;
      },{passive:true});
    });

    // Reliable Android double-tap fallback, scoped only to the preview.
    v.addEventListener("touchend",function(e){
      if(e.changedTouches.length!==1)return;
      const t=e.changedTouches[0],now=Date.now();
      const dx=Math.abs(t.clientX-Z.lastX),dy=Math.abs(t.clientY-Z.lastY);
      if(now-Z.touchTap<350&&dx<32&&dy<32){
        setZoom(Z.scale>1.001?1:2);
        Z.touchTap=0;
      }else{
        Z.touchTap=now;Z.lastX=t.clientX;Z.lastY=t.clientY;
      }
    },{passive:true});
  }

  function scheduleBind(){
    if(queued)return;
    queued=true;
    requestAnimationFrame(function(){
      queued=false;
      bind(vp());
    });
  }

  window.niInstallPreviewZoom=function(){scheduleBind();};
  window.niResetPreviewZoom=function(){setZoom(1);};
  window.niPreviewToggleZoom=function(){setZoom(Z.scale>1.001?1:2);};

  // Observe only mutations that can actually create/replace the preview.
  // This avoids running work for unrelated dashboard/history/UI changes.
  const observer=new MutationObserver(function(records){
    for(const r of records){
      for(const n of r.addedNodes){
        if(n.nodeType!==1)continue;
        if((n.matches&&n.matches(".ni-preview-viewport,.ni-preview-document")) ||
           (n.querySelector&&n.querySelector(".ni-preview-viewport,.ni-preview-document"))){
          scheduleBind();
          return;
        }
      }
    }
  });
  observer.observe(document.documentElement,{subtree:true,childList:true});
  scheduleBind();
})();
</script>

<script>
/*
 * v4.57 — TOKEN LIFECYCLE + DUPLICATE-SYNC SURGICAL FIX
 *
 * Scope is intentionally limited to Google credential refresh and backup
 * orchestration. Invoice/PDF/calculation/UI/business logic is untouched.
 *
 * Root cause fixed:
 *   refreshGoogleCredential() called acceptGoogleCredential(..., silentRefresh)
 *   and acceptGoogleCredential() re-enqueued the ENTIRE current state on every
 *   refresh. That created duplicate queue operations and repeated Drive writes.
 *
 * Fix:
 *   1) Silent credential refresh never seeds the full state queue.
 *   2) A silent refresh may drain already-pending work, but it cannot create
 *      duplicate module records by itself.
 *   3) Backup Now gets a single-flight lock so double taps/concurrent calls
 *      cannot create two snapshots.
 *   4) Refresh uses GIS auto-select where Google allows a non-interactive
 *      credential renewal; if Google does not issue a credential, the existing
 *      interactive re-auth path remains the safe fallback.
 */
(function(){
  try{
    if(typeof V42==='undefined') return;

    /* ---- 1. Prevent queue reseeding during silent Google credential refresh ---- */
    if(!V42._enqueueCurrentStateGuardInstalled && typeof V42.enqueueCurrentState==='function'){
      const originalEnqueueCurrentState=V42.enqueueCurrentState;
      V42.enqueueCurrentState=async function(){
        if(V42._silentCredentialRefresh===true) return 0;
        return await originalEnqueueCurrentState.apply(this,arguments);
      };
      V42._enqueueCurrentStateGuardInstalled=true;
    }

    /* ---- 2. Robust Google ID-token refresh ---- */
    if(typeof V42.refreshGoogleCredential==='function'){
      V42.refreshGoogleCredential=async function(){
        if(V42._googleRefreshPromise) return V42._googleRefreshPromise;

        V42._googleRefreshPromise=(async()=>{
          try{
            /* Do not refresh a token that is still comfortably valid. */
            if(typeof V42.isGoogleTokenUsable==='function' &&
               V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,300)) return true;

            await V42.loadGIS();
            if(!V42.googleClientId || !isGoogleUser(CLOUD.user)) return false;
            if(!window.google || !google.accounts || !google.accounts.id) return false;

            return await new Promise(resolve=>{
              let done=false;
              const finish=v=>{if(done)return;done=true;resolve(!!v);};
              const timeout=setTimeout(()=>finish(false),10000);

              try{
                google.accounts.id.initialize({
                  client_id:V42.googleClientId,
                  auto_select:true,
                  cancel_on_tap_outside:false,
                  callback:async resp=>{
                    try{
                      if(!resp || !resp.credential) return finish(false);
                      V42._silentCredentialRefresh=true;
                      try{
                        await V42.acceptGoogleCredential(resp.credential,{silentRefresh:true});
                      }finally{
                        V42._silentCredentialRefresh=false;
                      }
                      clearTimeout(timeout);
                      finish(typeof V42.isGoogleTokenUsable==='function' &&
                             V42.isGoogleTokenUsable(V42.idToken||CLOUD.token,60));
                    }catch(e){
                      V42._silentCredentialRefresh=false;
                      clearTimeout(timeout);
                      finish(false);
                    }
                  }
                });

                google.accounts.id.prompt(notification=>{
                  /* If GIS explicitly says no credential will be returned, fail
                     cleanly and let the caller use interactive re-auth. */
                  if(notification && (notification.isNotDisplayed?.() || notification.isSkippedMoment?.())){
                    clearTimeout(timeout);
                    finish(false);
                  }
                });
              }catch(e){
                clearTimeout(timeout);
                finish(false);
              }
            });
          }finally{
            V42._googleRefreshPromise=null;
            V42._silentCredentialRefresh=false;
          }
        })();

        return V42._googleRefreshPromise;
      };
    }

    /* ---- 3. Backup Now: single-flight protection only ----
       The existing proven backup implementation remains the worker. */
    if(typeof window.cloudBackupNow==='function' && !window._mdmBackupSingleFlightInstalled){
      const originalBackupNow=window.cloudBackupNow;
      window.cloudBackupNow=async function(){
        if(V42._backupInFlight) return;
        V42._backupInFlight=true;
        try{
          return await originalBackupNow.apply(this,arguments);
        }finally{
          V42._backupInFlight=false;
        }
      };
      window._mdmBackupSingleFlightInstalled=true;
    }

    /* ---- 4. Diagnostics: expose the actual token lifecycle state without
       changing any visible UI. Useful for self-test/debug only. */
    V42.getCredentialDiagnostics=function(){
      const token=V42.idToken||CLOUD?.token||null;
      let exp=null,secondsRemaining=null;
      try{
        const part=String(token||'').split('.')[1];
        if(part){
          const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'=')));
          exp=Number(payload.exp||0)||null;
          if(exp) secondsRemaining=Math.max(0,exp-Math.floor(Date.now()/1000));
        }
      }catch(e){}
      return {
        googleSession:!!isGoogleUser?.(CLOUD?.user),
        tokenPresent:!!token,
        tokenExpiryEpoch:exp,
        tokenSecondsRemaining:secondsRemaining,
        refreshInFlight:!!V42._googleRefreshPromise,
        backupInFlight:!!V42._backupInFlight,
        silentRefreshGuard:!!V42._silentCredentialRefresh
      };
    };

    console.info('[MDM v4.58] Token lifecycle + verified per-module Backup & Sync fix installed');
  }catch(e){
    console.warn('[MDM v4.58] Surgical fix install skipped:',e);
  }
})();
</script>
